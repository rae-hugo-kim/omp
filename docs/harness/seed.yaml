task_id: "20261113-061313-129f"
# gh-loop worker Stage 2에 따라 이슈 #129 본문("만들 것" 1~7, "정해 둔 것", AC 8개, "범위 밖", "#131 머지 뒤 알게 된 것")을 명세로 삼습니다.
# 이슈 본문이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(harness-skill-tune-inspect-127)는 git 이력에 보존합니다.
goal: >
  #129: omp 릴리스 대 하네스 마찰 감사 스킬 harness-friction을 만듭니다 — 마지막 감사 버전(기준 기록)부터 설치된 omp까지의
  릴리스 노트를 전수 수집·대조하고, 에이전트·규칙의 고정 모델 참조가 현재 omp에서 해석되는지 결정적으로 검사하며,
  변경마다 충돌/드리프트/무관을 판정한 보고서와 이슈 분할안을 냅니다. 첫 실행으로 18.11.1 → 18.18.6 구간 보고서를 싣습니다.
constraints:
  - "스킬 이름은 harness-friction입니다(omp 빌트인 명령·CLI 하위 명령·번들 에이전트·로드된 스킬 83개와 대조해 충돌 없음 — 이슈에서 확정)."
  - "소스 리포 전용입니다 — scripts/harness-sync.sh 화이트리스트에 넣지 않습니다. 기존 테스트나 문서 검사가 전수 등재를 요구하면 고치지 않고 결정 요청으로 올립니다."
  - "adversary-argon의 거취(이전·패널 축소)는 사용자가 보류한 결정입니다. 감사는 충돌로 보고하고 선택지만 남기며, 에이전트 정의·규칙·modelRoles를 바꾸지 않습니다."
  - "보고서는 이슈 분할안까지만 냅니다. 이슈 생성은 사용자 승인 뒤에만 합니다."
  - "결정적으로 판정되는 것(구간·수집·모델 참조 생존·기준 갱신)만 스크립트로 하고, 릴리스 노트 읽기와 판정은 스킬 절차로 둡니다."
acceptance_criteria:
  - id: AC1
    title: ".omp/skills/harness-friction/SKILL.md가 있고, frontmatter name이 디렉터리명과 같으며 description이 있습니다."
  - id: AC2
    title: "모델 참조 생존 검사가 픽스처에서 해석되지 않는 고정 model: 값을 지적으로 내고, 해석되는 고정값과 롤 참조(@advisor, [\"@task\", \"@default\"])는 지적하지 않습니다."
  - id: AC3
    title: "기준 버전 기록이 리포에 있고, 스킬 절차가 감사 뒤 갱신을 지시합니다."
  - id: AC4
    title: "18.11.1부터 감사 시점 설치 버전(18.18.6)까지의 감사 보고서가 이 PR에 들어 있고, 구간 릴리스 수와 읽은 수가 같으며, v18.18.4의 Antigravity 중지가 .omp/agents/adversary-argon.md와의 충돌로 실려 있습니다."
  - id: AC5
    title: "보고서가 발견한 마찰을 이슈 분할안(번호와 확인 문장)으로 정리하고, 이슈를 직접 만들지 않습니다."
  - id: AC6
    title: "adversary-argon·reviewer.md의 패널 구성과 규칙 본문은 이 PR에서 바뀌지 않습니다."
  - id: AC7
    title: ".omp/skills/init/SKILL.md의 \"소스 리포 전용 자산 제거\" 목록에 .omp/skills/harness-friction/이 있습니다."
  - id: AC8
    title: "node --test .omp/extensions/harness/tests/*.test.mjs와 node scripts/docs-drift가 통과하고, CHANGELOG.md의 [Unreleased]에 항목이 있습니다."
out_of_scope:
  - "감사가 찾은 마찰의 수정(각각 별도 이슈)과 이슈 자동 생성."
  - "adversary-argon·modelRoles.vision 변경."
  - "렌더된 시스템 프롬프트 diff, harness-check --smoke(#31에 남은 범위)."
  - "소비 리포 동기화(harness-sync.sh 화이트리스트)와 전역 스킬 미러(~/.claude/skills) 복사."
  - "18.18.7~18.20.0 릴리스(설치 버전 밖 — 다음 감사 구간)."
assumptions:
  - "시작 HEAD는 main ffae347(#131 머지)이고 실측은 omp 18.18.6 WSL 호스트 기준입니다."
  - "omp 업스트림 저장소는 can1357/oh-my-pi이고 gh release list/view로 본문을 받을 수 있습니다(26개 전부 수신 확인)."
  - "omp models --kind all --json이 {models:[{provider,id,selector,kind}]} 형태를 냅니다(18.18.6 실측)."
risks:
  - "릴리스 노트 판정은 에이전트의 읽기에 기대므로 재현율은 읽은 축 이해에 달려 있습니다 — references/harness-surface.md가 축을 고정하지만 누락은 가능합니다."
  - "생존 검사는 카탈로그 존재만 봅니다. 로그인·쿼터·요청 거부는 실제 호출에서야 드러납니다."
  - "규칙 본문의 모델 id는 백틱 안 provider/model 형태만 잡습니다. 산문 속 이름(Argon, opus)은 사람이 읽어야 합니다."
  - "테스트 파일은 .omp/extensions/harness/tests/에 있어 소비 리포로 동기화됩니다 — 스킬이 없으면 skip합니다(harness-skill-tune.test.mjs와 같은 방식)."
