# gh-loop worker Stage 2에 따라 이슈 #29 본문(제안·비범위)과 "세션에서 직접 결정함" 댓글(결정 A — 기준 3개 그대로, 대상 harness-* 29편, 이 사이클은 제안만)을 명세로 삼습니다.
# 직전 완료 seed(gh-loop-dispatch-closeout-record-79)는 git 이력에 보존합니다.
goal: >
  .omp/rules/harness-*.md 29편 전수를 기준 3개(참조 여부 / 게이트 배선 / 최근 발동 사례)로 실측해
  규칙별 판정표(생/사/병합 후보 + 근거 경로)를 docs/ 아래 감사 문서로 남기고, 삭제·병합 제안 목록을
  PR 본문에 담습니다 — 규칙 파일 자체는 수정·삭제하지 않습니다.
constraints:
  - "기준 1(참조 여부)·2(게이트 배선)는 기계적으로 판정합니다: 실행한 명령과 출력을 감사 문서에 그대로 기록해 재현 가능하게 합니다."
  - "기준 3(최근 발동 사례)은 docs/harness/audit.jsonl·docs/sum·docs/reviews 사이드카·이슈/댓글의 흔적을 경로·번호로 인용해 판정합니다."
  - "이 사이클에서는 .omp/rules/harness-*.md를 수정·삭제·병합하지 않습니다 — 제안만이고 삭제는 별도 승인 후속 사이클입니다."
  - "같은 시각 별도 브랜치에서 작업 중인 파일(scripts/harness-version-bump.sh·CHANGELOG, gh-loop-issue.mjs·gh-loop/gh-fanout SKILL 제목 절차, CI 워크플로, 게이트 .mjs)은 건드리지 않습니다."
  - "Stage 2의 체크 완료 seed·scope → 변경 → 리뷰 후속 → closeout 커밋 순서를 따릅니다."
acceptance_criteria:
  - id: AC1
    title: "docs/harness/rules-liveness-audit-2026-10-06.md에 29편 전수 판정표가 있습니다: 규칙별로 기준 1·2·3 실측값과 생/사/병합 후보 판정, 근거 경로를 한 행씩 적습니다."
  - id: AC2
    title: "기준 1·2는 문서에 실행 명령과 출력을 그대로 기록합니다: 명령을 리포 루트에서 다시 실행하면 문서의 표와 같은 숫자가 나옵니다."
  - id: AC3
    title: "기준 3은 audit.jsonl 이벤트·docs/sum 파일명·docs/reviews 사이드카·이슈/댓글 번호를 규칙별로 인용하고, 흔적이 없는 규칙은 '흔적 없음'으로 명시합니다."
  - id: AC4
    title: "삭제·병합 제안 목록이 감사 문서와 PR 본문에 있고, .omp/rules/harness-*.md 29편은 변경되지 않습니다(git diff --stat main -- .omp/rules 가 비어 있음)."
  - id: AC5
    title: "node scripts/docs-drift 0 errors/0 warnings, 하네스 suite(node --test .omp/extensions/harness/tests/*.test.mjs) 전부 통과, 그리고 이 이슈의 dispatch 튜플이 ingest되어 audit.jsonl에 gh_loop_dispatched(issue 29) 행이 있습니다."
out_of_scope:
  - "규칙 내용 개정·삭제·병합 실행 — 생사 판정과 제안까지만입니다(이슈 본문 비범위 + 세션 결정)."
  - "harness-sync 화이트리스트·소비 리포 제거 절차 변경 — 삭제가 승인되는 후속 사이클의 몫입니다."
  - "PR 생성·교차검증 게시·head와 nonce 결정 요청은 커밋 뒤 후속 절차이며 AC 선체크 대상이 아닙니다."
assumptions:
  - "시작 HEAD는 PR #81이 머지된 0f205a7이고 작업트리는 깨끗했습니다."
  - "docs/sum·docs/reviews는 gitignore 로컬 전용이라 메인 체크아웃(/home/rae/projects/workspace/omp)의 사본을 읽기 전용으로 집계합니다 — 다른 머신에서는 그 부분의 숫자가 다를 수 있습니다."
risks:
  - "이름 언급(grep)은 발동의 근사치입니다: 이름이 안 나와도 harness-core가 요약한 규칙은 매 요청 작동하고, 게이트가 집행하는 규칙은 이벤트 행으로만 흔적이 남습니다 — 판정표에 두 종류를 구분해 적습니다."
