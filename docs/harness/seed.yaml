name: gh-fanout-orca-workers-66
status: approved
version: 1
task_id: "20261002-151247-0c72"
# gh-loop Stage 2에 따라 이슈 #66과 사용자 워커 지시를 명세로 삼습니다.
# 직전 완료 seed(gh-loop-status-labels-69)는 git 이력에 보존합니다.
goal: >
  gh-fanout의 RPC 워커 경로를 gh-loop Stage 0의 Orca 2단계 기동 경로로 전환하고,
  GitHub 상태와 Orca 카드로 비차단 관측·재개·실패 처리를 안내합니다.
constraints:
  - "이슈 1개·워크트리 1개·워커 1개, cap, 단일 컨트롤러, 자동 머지 금지를 유지합니다."
  - "모델은 사용자 선택과 gh-loop:model 마커를 재사용하고 R8 상태 확장을 전달합니다."
  - "커밋은 체크 완료 seed·scope → 변경 → 리뷰 후속 → closeout 순서를 따릅니다."
  - "이 워커는 재디스패치·자기 워크트리 삭제·머지를 하지 않습니다."
acceptance_criteria:
  - id: AC1-orca-spawn
    title: "SKILL.md가 클레임 → worktree create --issue → terminal create → 준비 확인 → terminal send와 단계별 실패·전달 불확실성 처리를 설명합니다."
  - id: AC2-model-extension
    title: "사용자 모델 선택·이슈별 마커 재사용·R8 확장 전달·확장 부재 안내·단일 핸들 규칙을 설명합니다."
  - id: AC3-observe-resume
    title: "GitHub 라벨·댓글과 Orca 카드의 턴당 단발 관측, needs-decision 전이, 동일 워크트리 재개, 소유권 확인 후 정리를 설명합니다."
  - id: AC4-cutover-scope
    title: "현행 스킬과 controller 헤더의 RPC·raw git worktree 실행 안내를 제거하고, gh-loop·option A·audit 충돌 해결 방식은 변경하지 않습니다."
  - id: AC5-verification
    title: "controller·gh-loop 회귀 테스트, docs-drift, 링크·정본·규칙 충돌 점검, Orca CLI 읽기·카드 스모크 결과를 기록합니다."
  - id: AC6-docs
    title: "CHANGELOG에 #66 변경과 라이브 다중 워커 검증 한계를 기록합니다."
out_of_scope:
  - "gh-loop dispatch 구현 변경, option A 런타임, 모델 자동 선택은 다루지 않습니다."
  - "audit.jsonl 병렬 충돌 해결 방식은 #71에서 결정하며 이 변경은 기존 append-only 절차만 따릅니다."
  - "새 워커의 실제 fan-out 실행과 원격 머지·브랜치 삭제는 하지 않습니다."
  - "PR 생성·교차검증 게시·nonce 결정 요청은 커밋 뒤 후속 절차이며 AC 선체크 대상이 아닙니다."
assumptions:
  - "#65에서 실측한 worker-start의 omp 모델 거부·런처 셸 폴백을 전제로 2단계 경로를 재사용합니다."
  - "컨트롤러 결정 함수는 순수 함수로 유지하며 스폰·관측은 스킬 절차가 담당합니다."
risks:
  - "GitHub 라벨은 CAS가 아니므로 동시 컨트롤러는 지원하지 않습니다."
  - "명령 전달 실패는 전달 여부가 불확실할 수 있어 재스폰하지 않고 확인·park합니다."
  - "실제 다중 워커 기동은 수행하지 않으므로 읽기·카드 스모크가 전체 fan-out E2E 증거는 아닙니다."
