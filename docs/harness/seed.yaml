name: intent-ingest-fidelity-framework
status: draft
version: 1
task_id: "20260617-145852-04c2"
goal: >
  사용자가 임의 고도의 의도(포괄적 상위 문서 또는 변경노트)를 저작하면, 하네스가 이를
  추적가능·테스트가능한 AC로 추출하고 coverage를 검증하며 구현이 그것에 충실한지
  게이트로 보장하는 "의도-인제스트 충실-구현" 틀. 인터뷰 의존을 doc-ingest로,
  반복 작업의 게이트-부재를 자가감지 amend로 대체한다.

context:
  source: claudedocs/harness-auto-capture-analysis.md
  date_locked: 2026-06-17
  related_docs:
    - claudedocs/harness-auto-capture-analysis.md   # Q1–Q9 분석 + 설계 초안 v1
    - .omp/skills/kickoff/SKILL.md
    - docs/rules/seed_contract.md
    - docs/rules/kickoff_output_contract.md
    - docs/rules/closeout_contract.md
    - .omp/extensions/harness/gates/acceptance-gate.mjs

# 스키마 주: 본 seed는 기존 docs/harness/seed.yaml 선례의 richer 스키마(per-AC must/should/verify)를
# 따른다. docs/rules/seed_contract.md(flat string 배열)와 drift가 있으며, contract 정합은 out_of_scope.

constraints:
  - 기존 kickoff/seed/gate 확장으로 구현 — 신규 발명 최소 (Phase -1 ingest 패턴·rubric·Step3.5·acceptance-gate 재사용)
  - harness-sync.sh 자동 전파 경로 유지 (kickoff/startdev는 PATHS 등재됨, gate는 .omp/extensions/harness 통째 sync)
  - SSOT 무한 성장 금지 — seed=durable bounded, current-scope=thread bounded, audit.jsonl=유일 성장처 (Q7)
  - 역할 분리 — seed=체크할 SSOT, current-scope=스레드 작업목표, 혼동 없이 (Q8 R1)
  - 충실도 게이트는 advisory 아닌 실효 (현 kickoff-detector는 advisory뿐)
  - 머지 자동화 금지 (상위 비전 정합)
  - 수동/PoC 티어 대상, 24/7 인프라 비의존 (Q3.9)

# in_scope는 계약 필드 아님(참고용). out_of_scope는 계약대로 top-level.
in_scope:
  - P1 doc-ingest 모드 (kickoff 인터뷰→인제스트 재프레이밍)
  - authoring-time coverage 게이트 (rubric 5번째 축)
  - per-AC 출처추적 (AC가 source doc 섹션 인용)
  - P2 반복 thread-scope 복원 + 자가감지(L1) + commit backstop(L2)
  - audit provenance/satisfaction 원장 확장
  - 역할 분리 계약 명문화
  - verify-time verifier coverage 패스

out_of_scope:
  - 24/7 완전자율·상시응답 (robo-omp 프로젝트별 볼트온, 후순위; Q4.0)
  - 멀티세션 오케스트레이션 (RPC 워커 풀; Q3)
  - GitHub 이슈→fix→PR→교차검증 자율 루프 (Q2)
  - auto-memory/breadcrumb 재구축 (이미 가동; Q1)
  - CI reusable workflow·셋업 스킬 (틀 검증 후; Q2.10)
  - seed_contract.md 스키마 정합 (flat↔richer drift — 별도 cleanup)

assumptions:
  - 기존 kickoff/seed/gate를 확장 가능 (acceptance-gate.mjs·kickoff SKILL.md 구조 확인함)
  - OMP가 turn/commit 라이프사이클 이벤트를 노출 (analysis Q1에서 확인)
  - harness-sync.sh PATHS에 kickoff/startdev 등재 → 확장분 자동 전파 (analysis Q4)
  - richer 스키마가 acceptance-gate 파싱과 호환 (acceptance_criteria 존재 regex·status 체크 통과)

acceptance_criteria:
  - id: AC1-doc-ingest
    title: P1 doc-ingest 모드 (인터뷰→인제스트)
    source: "analysis Q4.4(a)·Q5.2·Q5.4 / kickoff SKILL.md:33-74 Phase -1 일반화"
    must:
      - kickoff가 문서 path/붙여넣은 스펙을 입력으로 수용 (인자 또는 감지)
      - 입력 문서를 섹션별로 파싱하여 요구사항 열거
      - 열거된 요구별로 AC 도출 (완전성 우선, 그럴듯한 부분집합 금지)
      - 문서 제공 시 인터뷰는 coverage 구멍 메우기로 축소 (전 5-phase 강제 안 함)
    should:
      - 문서 없으면 기존 5-phase 인터뷰로 자연 폴백
    verify:
      - 샘플 문서 ingest → 요구 N개 열거 + AC 매핑 표 산출 확인
      - 인터뷰가 미매핑/모호 항목으로만 한정되는지 확인

  - id: AC2-coverage-gate
    title: authoring-time coverage 게이트 (rubric 5번째 축)
    source: "analysis Q4.2·Q4.4(b)·Q9.2"
    must:
      - kickoff rubric에 5번째 차원 coverage 추가 (기존 4 clarity 축 + coverage)
      - 원본 요구 ↔ AC 매핑률 및 미매핑 잔차 명시
      - coverage LOW면 추가 추출 강제 (기존 Step5 LOW→ask 패턴 재사용)
    verify:
      - 일부러 요구 누락된 입력 → coverage LOW 판정 + 잔차 리스트 확인

  - id: AC3-per-ac-source
    title: per-AC 출처추적
    source: "analysis Q4.4(c)·Q8 R2"
    must:
      - 각 AC가 출처 문서 섹션 앵커를 인용 (seed AC에 source 필드)
    verify:
      - 본 seed 자체가 per-AC source 보유 (dogfood 증거)

  - id: AC4-p2-thread-scope
    title: P2 반복 thread-scope 복원
    source: "analysis Q5.3·Q8.2 G-scope"
    must:
      - 반복 스레드마다 current-scope.md 재생성 (현재 kickoff-only 생성 → 반복도 생성)
      - 닫힌/없는 seed에서 재개 시 thread-goal 파일 확보
    verify:
      - active seed 있는 상태에서 반복 작업 시작 → current-scope.md 재생성 확인

  - id: AC5-p2-l1-selfdetect
    title: P2 자가감지 L1 (in-agent)
    source: "analysis Q6.0·Q6.2 L1·Q6.3"
    must:
      - 규칙(AGENTS.md/rules)에 — 대화 중 scope-add/fix 감지 시 AC 제안
      - 테스트가능·명확하면 silent append, material gap이면 질문 (Q6.3 임계)
    verify:
      - scope-add 대화 → AC append 또는 질문 트리거 확인 (규칙 존재 + 동작 예시)

  - id: AC6-l2-backstop
    title: L2 commit backstop (runtime coverage)
    source: "analysis Q6.2 L2·Q9.2"
    must:
      - acceptance-gate 확장 — 코드변경 커밋인데 매칭 active AC 없으면 질문/차단
      - 현 "active AC 0 → no-op(allow)" 구멍을 "→ 질문"으로 전환
    verify:
      - active AC 없이 코드 커밋 시도 → backstop 발화 확인
      - draw-down(AC 커버됨) 커밋은 통과 확인

  - id: AC7-audit-provenance
    title: audit provenance + satisfaction 원장
    source: "analysis Q8.2 G-trace·Q8 R2"
    must:
      - audit.jsonl 스키마에 thread_id, seed_version, ac_targeted, verdict 기록
      - 커밋 메시지에 thread/task_id 링크
    verify:
      - 한 스레드 작업 후 audit에서 커밋→seed version→AC→verdict 체인 추적 확인

  - id: AC8-role-tiering
    title: 역할 분리 계약 (seed/scope/audit 3-tier)
    source: "analysis Q7·Q8.1"
    must:
      - seed=durable SSOT(체크대상), current-scope=스레드 목표, audit=원장 역할을 계약 문서에 명시
      - 에이전트가 혼동 없이 사용하도록 규칙화 + 성장 정책(seed/scope bounded, audit append-only)
    verify:
      - 계약 문서에 3-tier 역할·성장 정책 명시 존재

  - id: AC9-verifier-coverage
    title: verify-time verifier coverage 패스
    source: "analysis Q4.4(d)·Q9.2 runtime-coverage"
    must:
      - verifier가 AC ↔ 원본 doc 역매핑 재확인 (저작-시 AC2 + 검증-시 AC9 이중)
    verify:
      - verifier 실행 → coverage 잔차 0 또는 명시 확인

decisions:
  seed_granularity:
    value: feature-unit-durable
    reason: "(가) — seed=작업단위(feature) durable SSOT. 반복은 seed revise + thread-scope, 진짜 새 기능이면 새 seed. 스레드 경계는 L1 자가감지가 겸판. (analysis Q8.4·(가))"
  schema:
    value: richer-per-ac-verify
    reason: "기존 seed 선례 스키마(per-AC must/should/verify) 채택. contract(flat)와 drift이나 per-AC verify가 AC3와 정합. (analysis R3)"
  first_slice:
    value: "AC4 + AC6 + AC7 (P2 충실도 최소 루프)"
    reason: "기계적·신뢰가능, P2 게이트-0 구멍 직접 차단, tests/ 회귀 기반 존재. L1·doc-ingest·coverage rubric은 후속 슬라이스. (analysis Q8.3·Q9.3)"

risks:
  - id: R1
    desc: L1 자가감지 캘리브레이션 — 과탐(짜증)/과소탐(누락). 의미판단이라 regex 불가.
    mitigation: L2 backstop(기계적)이 L1 누락 포획. 질문은 충실도 gap에만 (Q6.3 임계).
  - id: R2
    desc: doc→AC 추출 완전성 보장 어려움 (큰 시드가 전부 짊어짐; Q9.1 load-bearing 1).
    mitigation: coverage 게이트(AC2) + verifier coverage(AC9) 이중 + 미매핑 잔차 명시.
  - id: R3
    desc: seed_contract.md(flat) ↔ 실제 seed(richer) 스키마 drift.
    mitigation: 본 작업은 richer 채택(precedent + per-AC verify 정합). contract 정합은 out_of_scope.
  - id: R4
    desc: P2 "스레드 경계"(seed revise vs 새 seed) 판단 모호.
    mitigation: L1 자가감지가 "기존 연장 vs 새 기능" 겸판 ((가) 결정).

references:
  - path: claudedocs/harness-auto-capture-analysis.md
    reason: Q1–Q9 분석 + 설계 초안 v1 (본 seed의 원본 상위 문서)
  - path: .omp/skills/kickoff/SKILL.md
    reason: 확장 대상 — Phase -1 ingest 패턴, Step3.5/Step4 rubric
  - path: .omp/extensions/harness/gates/acceptance-gate.mjs
    reason: 확장 대상 — L2 backstop (slice 1)
