# gh-loop worker Stage 2에 따라 이슈 #31의 2026-11-13 "범위 확정" 댓글(코디네이터 세션 결정)의 범위와 AC 6건을 명세로 삼습니다.
# 본문의 제안 2(harness-check --smoke)와 2026-09-25 댓글의 시스템 프롬프트 block 0 diff는 이 seed의 범위가 아닙니다.
# 직전 완료 seed(adversary-panel-cycle2-112)는 git 이력에 보존합니다.
# v4: 2026-11-13 세션 결정 B(이슈 댓글 #issuecomment-6843284693, "추천대로 ㄱㄱ")로 `index.ts` 미변경 제약을 풀고 AC7·AC8을 더했습니다.
goal: >
  #31 사이클 ①(omp 업데이트 감지): `harness-version-check.mjs`가 세션 시작 때 `omp --version`을 `.omp/state/omp-version.json`의
  기록과 비교해, 버전이 바뀌었으면 `HARNESS NOTE` 한 줄을 1회 내고 기록을 갱신합니다. 알림은 소스 리포에서는 마찰 감사 스킬
  (harness-friction, #129)을, 소비 리포에서는 harness-check를 가리킵니다. 기록이 없는 첫 실행, 같은 버전 재시작, omp를 실행할 수
  없는 호스트에서는 무발화이며 세션 시작을 막지 않습니다. 링크드 워크트리에서의 동작을 정해 테스트로 고정합니다.
constraints:
  - "범위는 이슈 #31 '범위 확정' 댓글의 제안 1(업데이트 감지)뿐입니다."
  - "구현 위치는 `.omp/extensions/harness/gates/harness-version-check.mjs`이고, 기록은 같은 파일의 HOOKS INACTIVE·POLICY SHADOWED 프로브처럼 세션 루트의 `.omp/state/` 아래 JSON 파일(`omp-version.json`)에 둡니다."
  - "`index.ts`는 `session_start` 호출의 payload에 UI 유무(`has_ui`)를 싣는 변경만 합니다(2026-11-13 세션 결정 B). 턴 시작·커밋 직후 재확인 호출의 배선과 notify/logger 분기는 바꾸지 않습니다."
  - "#129가 머지되기 전에는 문서(CHANGELOG·README 등)에 슬래시 호출 형태의 harness-friction 참조를 적지 않습니다 — `scripts/docs-drift`가 문서의 스킬 참조를 실존 검사합니다. 게이트 코드와 테스트의 문자열에만 씁니다."
  - "프로브는 세션 시작을 막지 않습니다 — 예외를 올리지 않고 exit 0을 유지하며 `omp` 호출에는 timeout을 둡니다."
  - "Stage 2의 체크 완료 seed·scope → 코드 커밋 → 리뷰 후속 → closeout 커밋 순서를 따릅니다."
acceptance_criteria:
  - id: AC1
    title: "세션 시작 호출에서 기록된 버전과 현재 `omp --version`이 다르면 `HARNESS NOTE`를 1회 내고 기록을 갱신하며, 같은 버전으로 다시 시작하면 무발화다. 턴 시작·커밋 직후 재확인 호출(`max_age_ms` 있음)은 알림도 기록도 하지 않아 1회 알림을 소비하지 않는다."
  - id: AC2
    title: "기록이 없는 첫 실행은 현재 버전만 기록하고 무발화다(읽을 수 없는 기록도 같은 경로)."
  - id: AC3
    title: "`omp`를 실행할 수 없거나(PATH에 없음·비정상 종료) 출력에서 버전을 읽지 못하면 알림도 기록 변경도 없이 통과한다 — exit 0, stdout·stderr 비어 있음."
  - id: AC4
    title: "알림이 가리키는 스킬이 소스 리포(`harness-meta.json`에 `source_remote` 없음)에서는 harness-friction, 소비 리포에서는 harness-check로 갈린다."
  - id: AC5
    title: "링크드 워크트리에서는 무발화·무기록(기록 파일을 만들지도 바꾸지도 않음)이고 같은 리포의 메인 체크아웃이 1회 알린다 — fixture 테스트로 고정한다."
  - id: AC6
    title: "`node --test .omp/extensions/harness/tests/*.test.mjs`가 전부 통과하고(신규 케이스는 RED → GREEN) `node scripts/docs-drift`가 0 errors이며 `CHANGELOG.md`의 `[Unreleased]`에 항목이 있다."
  - id: AC7
    title: "`index.ts`의 `session_start` 호출이 UI 유무를 payload `has_ui`로 넘기고 게이트는 `has_ui`가 true일 때만 프로브를 돌린다 — UI 없는 세션 시작(`omp -p`, 서브에이전트)과 표시가 없는 호출(재확인, 수동 실행)은 알림도 기록도 하지 않아 다음 UI 세션 시작이 알림을 받는다. 게이트 테스트와 배선 테스트로 고정한다."
  - id: AC8
    title: "`omp --version` 출력에 `omp/` 접두 줄이 있으면 다른 버전 꼴 줄보다 우선해 읽고, `omp` 호출은 timeout에 SIGKILL로 끝낸다(SIGTERM을 무시하는 omp가 게이트를 붙잡지 않는다) — 테스트로 고정한다."
out_of_scope:
  - "이슈 본문의 제안 2(`harness-check --smoke`)와 `harness-sync.sh` 완료 직후 스모크 자동 실행."
  - "2026-09-25 댓글의 렌더된 시스템 프롬프트 block 0 diff 축."
  - "harness-friction 스킬 자체(#129)와 #127·#128."
  - "`scripts/harness-sync.sh` 변경(sync의 캐시 삭제 목록에 버전 기록을 넣지 않습니다 — 캐시가 아니라 비교 기준입니다)."
  - "`index.ts`에서 `session_start` payload 밖의 변경(재확인 호출 배선, notify/logger 분기, 다른 핸들러)."
  - "PR 생성(본문에 링크드 워크트리 선택 근거 기재)·교차검증 게시·head와 nonce 결정 요청은 커밋 뒤 후속 절차이며 AC 선체크 대상이 아닙니다."
assumptions:
  - "시작 HEAD는 main 2f136f3(PR #126 머지 후)이고 작업트리는 깨끗했습니다(ingest가 더한 audit.jsonl 1행 제외)."
  - "`omp --version`은 stdout 한 줄 `omp/<semver>`를 내고 이 호스트(omp 18.18.6)에서 약 10ms에 끝납니다(2026-11-13 실측)."
  - "세션 시작 호출의 게이트 출력은 `ctx.ui.notify`(UI가 없으면 logger)로만 가고 에이전트 컨텍스트에는 들어가지 않습니다(`index.ts` session_start 핸들러)."
  - "`ctx.hasUI`는 TUI 메인 세션에서 true이고 `omp -p` 메인 세션과 task 서브에이전트(부모가 TUI든 `omp -p`든)에서 false입니다(2026-11-13 실측, omp 18.18.6)."
risks:
  - "링크드 워크트리 무발화를 택했으므로 메인이 bare이거나 메인 체크아웃에서 세션을 열지 않는 리포는 알림을 받지 못합니다."
  - "UI 없는 세션만 여는 체크아웃(headless 자동화 전용)은 알림을 받지 못합니다 — 알림을 볼 사람이 없는 세션이라 의도한 동작이고, 다음 UI 세션 시작이 알립니다."
  - "프로브 실행이 `index.ts`가 넘기는 `has_ui`에 의존합니다 — session_start 호출이 표시를 넘기지 않게 배선이 바뀌면 프로브가 조용히 꺼집니다(배선 테스트가 그 변경을 실패시킵니다). 새 `index.ts`는 세션을 다시 시작해야 로드되므로, 옛 확장을 로드한 세션에서는 프로브가 돌지 않고 기준 기록 생성과 알림이 다음 UI 세션 시작까지 미뤄집니다."
  - "`has_ui`는 omp의 `ctx.hasUI`이지 알림이 사람에게 보인다는 보장이 아닙니다. ACP 모드는 `ctx.hasUI`가 true이지만 `notify`가 디버그 로그만 남기고(omp extensions 문서 'ACP mode' 절), `ctx.mode`가 RPC 클라이언트와 같은 `rpc`라 구분할 수 없습니다 — ACP 세션이 메인 체크아웃에서 버전 변경을 먼저 보면 1회분이 보이지 않은 채 소비됩니다. 닫으려면 프로브를 TUI 세션 시작으로 좁혀야 하며(RPC 클라이언트도 함께 제외됨) 사용자 결정 사항입니다."
  - "Windows native에서 `omp`가 `.cmd` shim이면 `execFileSync`가 실행하지 못해 AC3 경로로 무발화합니다(미실측)."
