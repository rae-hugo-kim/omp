# 이슈 #112 본문(2026-10-19 사용자 결정 "sol·opus5.5·argon 추가 후 사용 결과로 모델 확정")을 명세로 삼습니다.
# 직전 완료 seed(gh-loop-conditional-auto-merge-105)는 git 이력에 보존합니다.
goal: >
  #112 사이클 ①: 3-pass 적대 리뷰의 Pass 2를 `adversary`(@advisor) 단일 스폰에서 같은 프롬프트를 쓰는
  4개 에이전트(adversary · adversary-sol · adversary-opus · adversary-argon) 병렬 패널로 바꾸고,
  소스별(reviewer 자신·멤버 4명·code-reviewer) 실측 모델 전부·thinking·상태·소요·verdict·finding별 심각도와 겹친 소스(also)를
  docs/reviews/review-<ts>.panel.jsonl 행으로 남겨 사이클 ②(모델 확정)의 자료를 만듭니다.
constraints:
  - "세 미러 파일 본문은 adversary.md와 바이트 동일해야 합니다 — 프롬프트가 같아야 모델 비교가 공정합니다. 본문은 adversary.md에서만 고치고 다시 미러합니다."
  - "멤버는 frontmatter model 고정값(openai-codex/gpt-5.6-sol · anthropic/claude-opus-5-5 · google-antigravity/gemini-4-argon)이고 세 미러의 thinkingLevel은 argon 상한에 맞춘 high입니다. 기존 adversary는 @advisor 롤 접미사(:xhigh)를 따라 thinking이 같지 않습니다(실측) — 롤 변경은 범위 밖이고 분석 때 보정합니다."
  - "완료 = 최종 출력에 파싱 가능한 ## Verdict 라인이 있고 Findings/Clean Areas가 diff의 file:line을 하나 이상 인용함. 그 외(오류·429·인증 회수·404·거부·블로커 메시지·잘린 보고·file:line 없는 verdict)는 failed로 행만 남기고 패널을 막지 않습니다. 사이드카 models는 reviewer 자신의 레코드 전부 + 완료 멤버 각각의 마지막 model_change 모델이고, 이종성은 소스 단위 — 완료 멤버 하나 이상의 마지막 모델이 reviewer의 어느 레코드에도 없는 계열일 때만 성립하며, 그렇지 않으면 null(PASS 계열이면 사이드카 자체를 쓰지 않음)입니다."
  - "소스별 결과는 리뷰와 같은 basename의 docs/reviews/review-<ts>.panel.jsonl(gitignored)에 남깁니다 — 리뷰 중 추적 파일(audit.jsonl)을 건드리면 staged diff 해시가 어긋납니다(패널 r1 지적). sync 목록에는 미러 파일 3개만 추가합니다."
