# gh-loop worker Stage 2에 따라 이슈 #78 본문(적용 지점 4개·주의 2개·AC 4개)과 "세션에서 직접 결정함" 댓글(본문 AC 4건 그대로 진행)을 명세로 삼습니다.
# 직전 완료 seed(rules-liveness-audit-29)는 git 이력에 보존합니다.
goal: >
  에이전트가 새로 만드는 이슈·PR 제목이 `#N <제목>`으로 시작하도록 gh-loop Stage 1·gh-fanout 추적 이슈·gh-loop Stage 3/compr PR의
  생성 절차(SKILL 명령 예시)를 고치고, gh-loop-issue.mjs의 normalizeTitle이 선행 `#N ` 접두를 벗기고 비교하게 해
  접두가 붙은 기존 열린 이슈와의 dedup이 깨지지 않게 합니다. 기존 이슈·PR 제목은 소급해서 바꾸지 않습니다.
constraints:
  - "이슈 제목은 번호를 생성 뒤에만 알 수 있어 `gh issue create` → `gh issue edit N --title \"#N <제목>\"` 2단계로 적습니다(gh-loop Stage 1, gh-fanout 추적 이슈)."
  - "PR 제목의 N은 PR 자신의 번호가 아니라 닫는 이슈 번호이며 `Closes #N`은 본문에 그대로 유지합니다."
  - "normalizeTitle은 `^#\\d+\\s+`에 해당하는 선행 접두만 벗기고(중간·단독 `#N`은 유지), 변경은 테스트로 고정합니다."
  - "기존 이슈·PR 제목 소급 변경 금지. scripts/harness-version-bump.sh와 CHANGELOG 헤더는 #47 워커 소관이라 건드리지 않습니다(CHANGELOG 항목 추가만 허용)."
  - "Stage 2의 체크 완료 seed·scope → 변경 → closeout 커밋 순서를 따르며, 구현 중 suite를 반복하지 않고 변경을 마친 뒤 최종 검증을 한 번 수행합니다."
acceptance_criteria:
  - id: AC1
    title: "gh-loop Stage 1·gh-fanout 추적 이슈·gh-loop PR(Stage 3/compr)의 생성 절차가 `#N ` 접두를 붙이고 SKILL.md 명령 예시가 이슈는 create→edit 2단계, PR은 닫는 이슈 번호 접두 1단계로 적혀 있습니다."
  - id: AC2
    title: "gh-loop-issue.mjs의 normalizeTitle이 선행 `#N ` 접두를 무시하고 비교하며(마커 해시 포함) gh-loop-issue.test.mjs가 접두 있는 기존 제목 dedup과 접두 경계 케이스를 고정합니다."
  - id: AC3
    title: "기존 이슈·PR 제목은 변경하지 않습니다(소급 금지). SKILL 문구에도 명시하고 이 작업은 어떤 기존 제목도 편집하지 않습니다."
  - id: AC4
    title: "하네스 suite(node --test .omp/extensions/harness/tests/*.test.mjs) 전부 통과, node scripts/docs-drift 0 errors/0 warnings."
out_of_scope:
