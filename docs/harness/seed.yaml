# gh-loop worker Stage 2에 따라 이슈 #99 본문 끝 "승인된 작업 범위"·AC 4건과 "세션에서 직접 결정함" 댓글(2026-10-12 "ㄱㄱ")을 명세로 삼습니다.
# 직전 완료 seed(windows-fifo-probe-triage-98)는 git 이력에 보존합니다.
goal: >
  #99: `gates/repo-root.mjs`의 `physicalResolve`가 POSIX 루트 `/`를 가정해 Windows 절대 경로(`C:\…`, `C:/…`, UNC)에서
  `repoToplevel`이 null을 돌려주고 cross-repo guard(#15)가 fail-open으로 끝나던 결함을, `path.parse(v).root`에서 시작해
  플랫폼 구분자 양쪽으로 쪼개는 방식으로 일반화합니다(`git-commit-detect.mjs`의 `chdir()`과 하나의 헬퍼를 공유).
  `path.win32`+인메모리 fs를 주입하는 단위 테스트로 수정 전 FAIL → 후 PASS를 고정하고, 통합 계약 residuals·README ko/en·CHANGELOG를 갱신합니다.
constraints:
  - "`link/..` 컴포넌트별 physical 해석 계약(review 2026-10-07 X3)과 같은 리포 링크드 워크트리 판정은 바꾸지 않습니다."
  - "POSIX 동작은 불변입니다 — 기존 cross-repo 테스트 전부 통과, Linux 전체 suite skip 0 유지."
  - "MSYS 표기(`/c/Users/…`)는 변환하지 않습니다. 통합 계약 residuals에 '귀속 null → 허용(실기 확인 필요)'로 기록만 합니다."
  - "게이트 코드이므로 코드 커밋 앞에 reviewer 3-pass(이종 모델)를 돌려 review-gate 사이드카를 만듭니다."
  - "Stage 2의 체크 완료 seed·scope → 코드 커밋 → 리뷰 후속 → closeout 커밋 순서를 따릅니다."
