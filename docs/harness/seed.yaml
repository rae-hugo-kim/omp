name: v17-harness-adaptation
status: approved
version: 4
task_id: "20260716-115803-9497"
goal: >
  omp 17.0.1 런타임 컷오버(ast_edit/ast_grep/resolve의 xd:// 디바이스 전환)와 하네스 원장
  배선의 정합을 복원한다 — 디바이스 경로 오염 제거, 프리뷰 적용·검색 앵커의 실파일 추적
  복원, pre-edit context-gate 불변식 유지.

references:
  - path: .omp/extensions/harness/index.ts
    reason: "죽은 배선의 소재 (구 resolve/ast_edit/ast_grep toolName 분기, editTargets)"
  - path: .omp/extensions/harness/gates/read-path.mjs
    reason: "순수 함수 계층 — 라우팅·타깃 추출이 이식될 테스트 가능 층"
  - path: tests/xdev-dispatch.test.mjs
    reason: "회귀 계약 (RED-first)"
  - note: "실증 프로브 2026-07-16: write xd://ast_edit → xd://resolve apply 후 session-log에 xd:/ 쓰레기 기록 + 실파일(probe-v17-scratch.mjs) 미추적. v17 계약 소스: packages/coding-agent/src/tools/resolve.ts (writeDeviceDispatch/ResolveDetails), docs/resolve-tool-runtime.md"

constraints:
  - 게이트 계약 불변 — exit 2 블록/stderr 경고/fail-open, 기존 게이트 스크립트 무수정
  - pre-edit read 불변식 유지 — xd://ast_edit 호출의 paths는 context-gate를 계속 통과해야 함 (URI 가드가 게이트를 느슨하게 만들면 안 됨)
  - 라우팅은 순수 함수로 추출 (read-path.mjs) — index.ts는 배선만, 순서(xdev 봉투 우선)는 구조로 고정
  - 클린 컷오버 — 단일 머신·단일 omp 바이너리(17.0.1) 전제, 구버전(pre-v17) shim 금지
  - telemetry seed(20260710-180439-3771) 무접촉 — 별도 스레드, git 체크포인트 653b302로 보존됨

acceptance_criteria:
  - "V1 URI 스킴 원장 오염 0 — xd://·local:// 타깃이 read-log/session-log에 로컬 경로로 기록되지 않음 (단위 + 라이브 프로브)"
  - "V2 xd://ast_edit 호출의 pre-edit context-gate 유지 — 미read 파일 BLOCK(negative) + read 후 통과(positive) 게이트 통합 테스트"
  - "V3 xd://resolve apply 실파일 추적 — write-tracker·backpressure-invalidator·breadcrumb 발화 (단위 + 라이브 프로브에서 실파일 edit 기록)"
  - "V4 xd://ast_grep 앵커 read 추적 — inner.files + 렌더 텍스트 폴백 (단위)"
  - "V5 회귀 0 — 기존 342 테스트 + 신규 xdev 스위트 전부 그린"
  - "V6 문서 부패 스위프 — 제거된 도구 참조(resolve/irc/job/launch/report_finding) 갱신, docs-drift 그린"

out_of_scope:
  - telemetry 계측 자체 (별도 seed 20260710-180439-3771 — 재개 시 git 복원 + thread-scope open)
  - upstream(oh-my-pi) 수정·이슈
  - hub 도구를 활용하는 하네스 신기능
  - grep/ast_grep 외 검색 디바이스의 신규 앵커 지원

assumptions:
  - 이 머신의 모든 레포는 단일 omp 바이너리를 공유한다 (17.0.1)
  - ast_edit/ast_grep은 xd:// 디바이스로만 도착한다 (top-level 도구 부재)
  - xdev 봉투 계약은 v17.0.1 소스 기준 {tool, mode, inner} (tools/resolve.ts writeDeviceDispatch)

risks:
  - xdev 봉투 형태가 upstream 마이너에서 변할 수 있음 → 계약을 단위 테스트로 고정하고 소스 라인을 references에 기록, 변화 시 harness-check 의례에서 재대조
  - 프리뷰 paths가 글롭일 때 context-gate 대상이 넓어질 수 있음 → 기존 v16 의미론(글롭 통과, 비존재 허용) 유지
