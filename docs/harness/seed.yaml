name: session-breadcrumb-capture
status: draft
version: 1
task_id: "20260618-142442-e610"
goal: >
  세션 재개 비용과 sum 호출 비용을 줄이기 위해, turn_end/tool_result에서 변경파일·테스트
  PASS/FAIL·커밋·AC토글을 no-LLM으로 자동 캡처(breadcrumb)하고, session.compacting에서 보존,
  session_start에서 관련 docs/sum을 표면화하며, 수동 sum이 breadcrumb을 seed로 소비한다.
  영속 사실(auto-memory)은 이미 자동이므로 재구축하지 않는다. (자율화 레이어 Q1)

context:
  source: claudedocs/harness-auto-capture-analysis.md  # Q1 (L23-107) = doc-ingest 원본 상위문서
  date_locked: 2026-06-18
  related_docs:
    - claudedocs/harness-auto-capture-analysis.md       # Q1.1-Q1.7
    - rules/session_persistence.md                       # stale 전제 정정 대상
    - docs/architecture/harness-architecture.md          # G7/G8 정정 대상
    - .omp/extensions/harness/gates/backpressure-tracker.mjs  # append-log 패턴 선례

# 스키마: intent-ingest-fidelity-framework seed 선례의 richer 스키마(per-AC must/verify/source).

constraints:
  - no-LLM 캡처 — breadcrumb append에 LLM 호출 금지(턴마다 비용/노이즈 금지)
  - session_shutdown에서 LLM 요약 금지 — 프로세스 종료 시점, 비동기 LLM 신뢰 불가(flush만)
  - auto-memory(영속 사실 A) 재구축 금지 — 이미 자동(`<memories>` 주입), 상호보완
  - 기존 tracker/append-log 패턴 재사용(`backpressure-tracker`→`test-history.json` 선례), 신규 발명 최소
  - 노이즈 최소 — 미완 스레드의 저품질 자동요약 양산 금지(Q1.4)
  - 풀 내러티브(C)는 수동 sum 유지 — 자동화하지 않음(인간 판단 필요)

in_scope:
  - turn_end/tool_result breadcrumb append (no-LLM)
  - session.compacting flush/preserve(preserveData)
  - session_start 관련 docs/sum 표면화(고아 해소)
  - sum 스킬이 breadcrumb seed 소비
  - stale 문서 정정(session_persistence/harness-architecture/ecc/AGENTS)

out_of_scope:
  - auto-memory 재구축(영속 사실 A — 이미 자동; Q1.2)
  - session.compacting sum 자동초안 생성(option 3 — 노이즈 위험, 잠정 제외; Q1.7)
  - 풀 트러블슈팅 내러티브 자동화(C는 수동 유지; Q1.4)

assumptions:
  - OMP가 turn_end/tool_result/session.compacting/session_start/session_shutdown 이벤트를 노출(Q1.1 확인)
  - `.omp/harness-state/`가 runtime append-log의 표준 위치(gitignored)
  - auto-memory(`memory.backend: local`) 활성 — 영속 사실 축 담당

acceptance_criteria:
  - id: AC1-breadcrumb-append
    title: turn_end/tool_result breadcrumb append (no-LLM)
    source: "analysis Q1.5·Q1.7 (L80, L97)"
    must:
      - turn_end 및/또는 tool_result 이벤트에서 breadcrumb 1줄 append (LLM 없음)
      - 기록 항목 — 변경 파일, 테스트 PASS/FAIL, 커밋 해시, AC 토글
      - 저장 위치/포맷은 append-only jsonl (`test-history.json` 패턴 확장)
    verify:
      - 이벤트 발생 → 해당 breadcrumb 줄이 append되는지 확인(가짜 이벤트 주입 테스트)
  - id: AC2-compact-flush
    title: session.compacting 보존(flush/preserveData)
    source: "analysis Q1.5 (L81)"
    must:
      - session.compacting에서 breadcrumb 상태를 flush/preserve(preserveData 반환)
    verify:
      - compacting 이벤트 → breadcrumb 보존 확인
  - id: AC3-startup-surface
    title: session_start 관련 docs/sum 표면화
    source: "analysis Q1.5·Q1.2-C (L82, L53)"
    must:
      - session_start에서 관련 `docs/sum/*.md`를 표면화(고아 md 해소)
    verify:
      - session_start → 관련 sum 표면화 메시지/주입 확인
  - id: AC4-sum-seeded
    title: sum 스킬이 breadcrumb seed 소비
    source: "analysis Q1.5·Q1.4 (L83, L68)"
    must:
      - `sum` 스킬이 breadcrumb(session-log)을 seed로 읽어 내러티브 초안 비용 절감
      - sum은 수동 유지(자동 호출 안 함)
    verify:
      - breadcrumb 존재 시 sum이 그것을 입력으로 참조하는지 스킬 절차 확인
  - id: AC5-no-shutdown-llm
    title: session_shutdown LLM 요약 금지
    source: "analysis Q1.5 (L84)"
    must:
      - session_shutdown에서 LLM 요약을 트리거하지 않음(flush 정도만)
    verify:
      - shutdown 경로에 LLM 요약 호출이 없음을 코드로 확인(부재 보장)
  - id: AC6-docs-corrected
    title: stale 문서 정정
    source: "analysis Q1.6 (L88-91)"
    must:
      - `rules/session_persistence.md` §Decision "no such events" 전제 정정 + 결정 재서술
      - `docs/architecture/harness-architecture.md` G7/G8 "의도적 미채택" 근거 정정
      - `claudedocs/ecc_harness_analysis.md` PreCompact/instinct cross-ref 갱신
      - breadcrumb 게이트 신설 시 `AGENTS.md` Harness Enforcement 표에 행 추가
    verify:
      - 위 문서들이 "이벤트 부재" 거짓 전제를 더 이상 담지 않음

decisions:
  trigger:
    value: "turn_end + tool_result"
    reason: "Q1.5 권장 — turn_end(턴 단위) + tool_result(세밀)."
    status: confirmed (default 채택 2026-06-18)
  storage:
    value: ".omp/harness-state/session-log.jsonl"
    reason: "Q1.5/Q1.7 — test-history.json과 같은 append-log 위치(gitignored runtime)."
    status: confirmed (default 채택)
  scope:
    value: "option 1 (breadcrumb + session_start surface + sum seed)"
    reason: "Q1.7 권장. option 3(session.compacting sum 자동초안)은 노이즈 위험으로 out_of_scope."
    status: confirmed
  sum_automemory_link:
    value: "분리 — session_start 표면화(AC3)만; auto-memory는 sum md를 읽지 않음"
    reason: "RES 해소(2026-06-18): '연계'는 auto-memory 동작을 바꿔 'auto-memory 재구축 금지' 제약과 모순. 고아 sum은 AC3 표면화로 충분. (analysis Q1.7 L98)"
    status: confirmed

risks:
  - id: R1
    desc: breadcrumb 노이즈/볼륨 — 매 tool_result append가 과대해질 수 있음
    mitigation: no-LLM 최소 필드만, jsonl append, 필요시 turn_end로 한정
  - id: R2
    desc: session_shutdown 비동기 신뢰 불가
    mitigation: shutdown은 flush만, LLM 금지(AC5)

