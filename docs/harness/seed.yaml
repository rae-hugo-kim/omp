# gh-loop worker Stage 2에 따라 이슈 #111 본문(마찰 지점 F8·F9, 해결 방향, AC 4개)을 명세로 삼습니다.
# 이슈 본문이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(bootstrap-source-only-skills-134)는 git 이력에 보존합니다.
goal: >
  #111: Copy-on-Write 워크트리 복제(omp worktree.clone)가 가져온 .omp/harness-state/의 증거 파일
  (backpressure-status, read-log.txt)이 새 워크트리에서 PASS·읽음 증거로 통하지 않게 하고,
  commitTargetDir의 선행 cd 처리 방식을 사용자 결정대로 테스트로 고정하며, 통합 계약에
  CoW 복제와 worktree.onStart 주의를 기록합니다.
constraints:
  - "F8(commitTargetDir의 선행 cd 추적 여부)은 워커가 정하지 않습니다 — 근거와 선택지를 이슈 댓글로 올리고 사용자 결정을 그대로 구현합니다."
  - "커밋 대상 판정의 전제는 bash의 git commit뿐입니다(9c1229c: commit.enabled off)."
  - "증거를 묶는 기준은 상태 디렉터리를 가진 디렉터리의 실경로(realpath)이며, 경로가 다르거나 없으면 fail-closed(증거 없음)로 취급합니다."
  - "커밋 게이트의 판정 규칙(risk별 BLOCK/WARN, skip 플래그, FAIL 차단)은 바꾸지 않습니다."
acceptance_criteria:
  - id: AC1
    title: "다른 워크트리 경로에서 복제된 .omp/harness-state/(backpressure-status=PASS, read-log.txt 항목)가 새 워크트리에서 PASS/읽음 증거로 인정되지 않음이 단위 테스트로 증명됩니다."
  - id: AC2
    title: "commitTargetDir(\"cd <wt> && git commit -m x\")의 동작(추적 또는 null 유지)이 사용자 결정으로 정해지고 테스트로 고정됩니다."
  - id: AC3
    title: "harness-harness_integration_contract.md에 CoW 복제·worktree.onStart 주의가 기록됩니다."
  - id: AC4
    title: "node --test .omp/extensions/harness/tests/*.test.mjs 전 항목이 통과합니다."
  - id: AC5
    title: "리뷰 r3 지적(사용자 결정 B, 2026-11-21)이 반영됩니다: 워크트리 경로 자체에 줄바꿈이 있으면 그 디렉터리의 증거가 다른 경로의 것으로 읽히지 않고(회귀 테스트), 통합 계약의 backpressure-gate 요약이 '남의 FAIL은 계속 차단'과 일치하며, 개행 없이 끝난 장부에 덧붙여도 항목이 온전하고(테스트), 줄바꿈 경로 테스트에 양성 대조가 있고, builtin cd 형태의 commitTargetDir 동작이 테스트로 고정됩니다."
out_of_scope:
  - "#51(같은 워크트리 서브에이전트의 harness-state 오염) — 같은 경로 안의 세션 격리라 경로 결속과 축이 다릅니다."
  - "경로를 담지 않는 일회성 플래그(commit-wip, docs/harness/*-skip, acceptance-done)와 cycle-estimate·session-log.jsonl의 복제 방어 — 통합 계약 잔존면으로 기록만 합니다."
  - "gh-loop/gh-fanout 스킬 본문 수정(이슈의 '최소 대안' — 코드 방어를 구현하므로 계약 문서 기록으로 갈음합니다)."
  - "omp eval commit 경로의 커밋 대상 판정."
assumptions:
  - "시작 HEAD는 d86a5e1(2026.91 범프)입니다."
  - "read-log.txt의 항목은 절대 경로입니다(read-path.mjs가 resolve(cwd, …)로 기록) — 복제된 장부가 실제로 여는 대상은 두 워크트리에서 경로가 같은 파일(워크트리 밖 파일, 다른 리포의 규율 파일)입니다."
  - "omp 18.22.0에서 worktree.clone 기본값은 true이고 worktree.onStart 값은 off|ask|create입니다(omp config list, 2026-11-19)."
risks:
  - "업그레이드 직후 기존 read-log.txt·backpressure-status가 한 번 무효가 됩니다(경로 없는 파일은 복제본과 구별할 수 없어 fail-closed) — 다시 읽고 다시 검증해야 합니다."
  - "reflink가 없는 파일시스템(이 호스트의 ext4)에서는 복제가 plain checkout으로 폴백하므로 실제 carry는 이 호스트에서 재현하지 못했습니다 — 테스트는 상태 디렉터리의 바이트 복사로 복제를 모사합니다."
