# gh-loop worker Stage 2에 따라 이슈 #128 본문("만들 것" 1~7, AC 7개, "범위 밖", "#131 머지 뒤 알게 된 것")을 명세로 삼습니다.
# 이슈 본문이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(harness-skill-tune-inspect-127)는 git 이력에 보존합니다.
goal: >
  #128: harness-skill-tune에 갱신 단계를 더합니다 — 점검 보고서의 지적을 기계적(정답이 하나)·판단 필요(개명·삭제·숨김·설명문·구조)로
  나눠, 기계적 지적은 고치고 ID와 함께 보고하며, 판단 필요 지적은 근거 수치와 번호 붙인 선택지로 제시해 사용자가 고른 것만 적용하고,
  가능한 경우 수정 전후를 서브에이전트로 평가한 뒤 재점검으로 지적 ID가 사라졌는지 확인합니다. 이 PR에서 실제 지적 1건을 그 절차로 처리합니다.
constraints:
  - "판단 필요 지적(개명·삭제·숨김·설명문 재작성·구조 변경)은 사용자 선택 없이 적용하지 않습니다. AC를 채우는 1건을 넘는 지적은 보고서의 선택지로만 남깁니다."
  - "kickoff의 critic·startdev의 test-engineer REF-AGENT 지적은 열린 #120이 다루므로 여기서 고치지 않고 #120을 가리킵니다."
  - "리포 밖 스킬(~/.claude/skills 미러 포함)은 고치지 않고 보고만 합니다. 스킬은 직접 커밋하지 않으며 변경은 일반 PR 경로(CHANGELOG 포함)로 나갑니다."
  - "점검 스크립트(skill-tune.mjs, 796줄)는 늘리지 않습니다 — 갱신 단계는 절차이고 재점검은 check --format json 전후 대조로 합니다. PR #131의 low 메모는 스크립트를 건드리지 않으므로 그대로 남깁니다."
  - "init 첫 커밋의 risk-assess 부트스트랩 창은 코드이므로 임의로 바꾸지 않습니다 — 창이 .omp/skills/harness-skill-tune/ 삭제를 덮지 않는다는 확인 결과는 결정 요청으로 올립니다."
acceptance_criteria:
  - id: AC1
    title: "SKILL.md에 갱신 단계가 있고, 기계적·판단 필요의 분류 기준과 각 처리 절차가 적혀 있습니다."
  - id: AC2
    title: "판단 필요 지적(개명·삭제·숨김·설명문 재작성·구조 변경)은 사용자 선택 없이 적용하지 않는다고 명시돼 있고, 근거 수치를 담은 선택지 형식 예시가 있습니다."
  - id: AC3
    title: "평가 단계에 실행 조건, 생략 조건, 결과 기록 형식이 적혀 있습니다."
  - id: AC4
    title: "리포 밖 스킬을 수정하지 않는다는 경계와, 스킬이 직접 커밋하지 않는다는 경계가 적혀 있습니다."
  - id: AC5
    title: "이 PR의 커밋에 실제 점검이 낸 지적 1건 이상을 이 절차로 끝까지 처리한 스킬 수정이 들어 있고, 그 커밋 트리에서 점검을 돌리면 해당 지적 ID가 나오지 않습니다."
  - id: AC6
    title: ".omp/skills/init/SKILL.md의 소스 리포 전용 자산 제거 목록에 .omp/skills/harness-skill-tune/이 있습니다."
  - id: AC7
    title: "node --test .omp/extensions/harness/tests/*.test.mjs와 node scripts/docs-drift가 통과하고, CHANGELOG.md의 [Unreleased]에 항목이 있습니다."
