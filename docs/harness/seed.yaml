name: harness-telemetry
status: draft
version: 2
task_id: "20260710-180439-3771"
goal: >
  각 세션에서 하네스 사용(게이트 기회·판정, 스킬 호출, 세션 메타)과 준수를 no-LLM
  append-only로 로깅하고 sum-vault 패턴으로 중앙 수집해, 게이트 차단·회복(마찰) /
  스킬 사용 빈도 / 미사용 자산 후보 / 마찰 시그널을 배치 집계로 평가할 수 있는
  하네스 텔레메트리 v1. (하네스 자체 평가의 측정 기반 — Q11)
references:
  - path: claudedocs/harness-auto-capture-analysis.md
    reason: "Q11 설계·제약(A1~A10)·해소된 결정 — 본 kickoff의 doc-ingest 원본"
  - path: docs/harness/kickoff-summary.md
    reason: kickoff 산출 요약
  - path: .omp/extensions/harness/index.ts
    reason: runGate/이벤트 배선 — 캡처 계측 지점(수정 대상)
  - path: .omp/extensions/harness/gates/commit-gates.mjs
    reason: 디스패처 child 구조화 기록(수정 대상, A3)
  - path: .omp/skills/sum/SKILL.md
    reason: sum-vault 백업 패턴(수집 레이어 선례, SUM_VAULT_DIR 규약)
  - path: scripts/harness-sync.sh
    reason: "전파 경로 — extensions 통째 sync(수집 로직 자동 전파), scripts/는 비전파(평가 스크립트는 소스 레포 전용으로 충분)"
  - path: omp://extensions.md
    reason: "세션 라이프사이클/이벤트 계약(A1/A7/A8 근거, 구현 시 재확인)"
constraints:
  - 전 층 no-LLM · append-only · fail-open — 텔레메트리 실패가 게이트 판정/사용자 작업을 절대 막지 않는다
  - blocking 금지, 이벤트별 git push 금지 — 수집은 append뿐, push·집계는 별도 배치(비범위)
  - "서브에이전트 활동은 v1에서 main 기준 합산 (2026-07-10 사용자 결정) — 단 오귀속 금지: 이벤트는 worker_session_id를 보존하고, 검증된 parent 매핑이 있을 때만 main으로 합산, 매핑 불가 시 parent_session_id:null로 worker 파일에 잔류(추측 귀속·폐기 금지)"
  - target_fp = cwd 기준 상대경로 그대로 (vault=private 전제; 외부 공유 시 별도 익명화)
  - Q11.3 불변식 A1~A10 준수 (세션 경계 rotate, execution/decision 분리, tracker kind 분리, 스킬 3경로 dedup, in-process 별도 계측)
  - 기존 게이트/트래커 동작·성능 회귀 금지 (usage writer는 이벤트당 O(1) append)
acceptance_criteria:
  - id: AC1-gate-capture
    title: 게이트 계측
    source: "claudedocs/harness-auto-capture-analysis.md #Q11.2, #Q11.3-A4/A9"
    must:
      - 'runGate 기회당 1건 `{ts, session_id, kind:gate, gate, tool, execution: ok|infra_error, decision: allow|warn|block, failure_reason?: spawn|timeout|badstatus, ms, target_fp}` 기록'
      - read/write/breadcrumb 등 트래커 실행은 kind:tracker로 분리 기록
    verify:
      - 단위테스트 — allow/warn/block/infra_error 4판정과 tracker 분리를 각각 단언
  - id: AC2-commit-gates-breakdown
    title: commit-gates child 분해
    source: "claudedocs/harness-auto-capture-analysis.md #Q11.3-A3"
    must:
      - 디스패처가 child별 `{gate, status, duration, failure}`를 구조화 기록(또는 machine-readable 반환) — 합산 exit에 뭉개지지 않음
    verify:
      - 단위테스트 — 4개 child 중 차단자가 식별되는지, allow 시 평가된 child 목록이 남는지
  - id: AC3-skill-capture
    title: 스킬 관측 3경로
    source: "claudedocs/harness-auto-capture-analysis.md #Q11.3-A5/A7"
    must:
      - "via:command(input 이벤트 /skill: 토큰) + via:read(tool_call read skill://) + via:message(custom skill message) 기록"
      - "dedup = 상관-소비 모델(원점 id 병기는 dedup 키로 무효 — command 관측과 후속 custom message는 id가 다름): interactive에서 /skill: 관측 시 extension이 invocation_id 발급 후 (session, skill) pending 큐에 적재 → 대응 custom skill message 도착 시 같은 invocation_id를 consume(신규 발급 금지); RPC/headless는 input 미발화이므로 custom message id로 신규 발급; 모델 주도 read skill://는 성공 tool_result의 tool_call id로 독립 invocation"
    verify:
      - 단위테스트 — 3경로 각각 1건 + interactive command→custom message 상관 시 consume되어 총 1건(이중 계수 없음) + pending 큐 미소비 항목의 만료 처리
  - id: AC4-session-boundary
    title: 세션 경계
    source: "claudedocs/harness-auto-capture-analysis.md #Q11.3-A1"
    must:
      - 모든 이벤트에 session_id(현 세션 — main 또는 worker) 기록; child 세션은 parent 매핑을 시도해 parent_session_id 기록(매핑 불가 시 null)
      - "aggregation_session_id = parent_session_id ?? session_id — 중앙/로컬 usage 파일 키는 검증된 aggregation_session_id만 사용"
      - main 세션은 ctx.sessionManager.getSessionId() 조회 + session_switch/branch/tree에서 writer rotate; kind:session 메타(omp_version, harness_version, repo) 기록
    verify:
      - 단위테스트 — rotate 후 이벤트가 새 session_id 파일에 기록
      - 단위테스트 — parent 매핑 불가 child 이벤트는 자기 worker 파일에 남고 main 파일로 오귀속되지 않음
      - "parent 연결 실측 증거 — 해석 가능이면 main→worker 연결 사례 1건; 실측 결과 해석 불가로 판명되면 그 관찰 기록 + null-잔류 경로 테스트로 대체 충족(AC 만족 출구 — constraints의 main 합산은 '매핑 가능한 범위'로 한정)"
  - id: AC5-collection
    title: 수집 (전 세션 보장)
    source: "claudedocs/harness-auto-capture-analysis.md #Q11.2-수집, #Q11.3-A2/A8"
    must:
      - "usage writer는 모든 kind 이벤트에 안정적 event_id(단조 ts + 랜덤 suffix 또는 uuid)와 project_id를 부여 — 병합·dedup의 조인 키(spool↔vault 병합이 디렉토리명 추측에 의존 금지)"
      - "project_id 규칙(writer/report 공유): normalized git remote `owner/repo`의 safe slug + short hash; remote 부재 시 canonical git-root basename + short hash — `..`·경로 구분자 제거, path-containment 검증(동명 repo 충돌·경로 탈출 방지)"
      - "per-event `$SUM_VAULT_DIR/_harness/<project_id>/<aggregation_session_id>.jsonl` append + user-global spool `$HOME/.omp/harness-telemetry-spool/<project_id>/<aggregation_session_id>.jsonl` 미러 — spool이 프로젝트 내부가 아닌 이유: report가 소스 레포에서 실행되므로 각 프로젝트 내부 미러는 발견 불가, 고정 2위치(vault, spool)만 병합하면 어디서 실행해도 완전"
      - vault 부재/쓰기 실패 시 spool만으로 조용히 지속(fail-open); session_stop은 flush 보조에 한정
      - "catch-up 재동기화: telemetry-report(또는 동봉 sync 스텝)가 vault∪spool을 event_id로 병합·dedup — 파일 존재 여부 복사가 아니라 이벤트 단위 완전성(중앙 파일이 있어도 빠진 append 복구); 잘린 마지막 JSONL 라인은 skip+경고 (수동 실행 축 유지)"
    verify:
      - 단위테스트 — vault 유/무 두 경우 모두 spool 보존, 예외 무전파
  - id: AC6-report
    title: 평가 스크립트
    source: "claudedocs/harness-auto-capture-analysis.md #Q11.2-평가, #Q11.3-A6/A9"
    must:
      - "scripts/telemetry-report — 게이트별 기회/차단/회복 집계(opportunity→outcome→recovery join), 스킬 빈도, execution/decision 분리. recovery-join은 '마찰(friction) 시그널'로 명명 — false-block 판정이 아니라 인간 리뷰용 후보 제시(정상 read→edit 준수 흐름과 자동 구분 불가)"
      - 계측 불가 규칙은 unknown으로 표기(과대평가 금지)
    verify:
      - 픽스처 jsonl 입력 → 기대 집계 출력 단위테스트 (recovery join·infra_error 구분 포함)
  - id: AC7-inprocess-coverage
    title: in-process 체크 계측
    source: "claudedocs/harness-auto-capture-analysis.md #Q11.3-A10"
    must:
      - mermaid-check 결과를 같은 usage writer로 `gate:"mermaid-check"` 기록(스폰 없음)
    verify:
      - 단위테스트 또는 소스 단언 — mermaid 경고 발생 시 usage 이벤트 존재
  - id: AC9-e2e-seam
    title: capture→report 관통 검증
    source: "plan-attack HIGH-4 (2026-07-10) — 층별 unit만으로는 writer↔report 스키마 seam 불일치가 전 AC를 통과"
    must:
      - 통합 테스트 1건 — 실제 usage writer가 생성한 이벤트 파일(픽스처 아님)을 telemetry-report에 입력해 스키마 seam·집계 정합 검증
    verify:
      - node --test 통합 케이스 — writer 산출물 입력 시 report가 기회/판정/스킬 집계를 오류 없이 산출
      - "통합 케이스 — 중앙 파일에서 일부 append가 누락된 상황을 재현해 event_id 병합이 spool로 복원하는지 + 잘린 꼬리 라인 skip+경고; 복구 실행은 이벤트를 생성한 프로젝트가 아닌 **다른 디렉토리에서** 수행해 발견 경로의 결정성 검증"
  - id: AC8-propagation-docs
    title: 전파·문서·회귀
    source: "하네스 표준 (README 구조 계약, docs-drift)"
    must:
      - README.md/README.en.md 표·문단, AGENTS.md 표 갱신 (신규 게이트/상태 파일 반영)
      - harness-sync 전파 확인 — 수집 로직은 extensions 통째 sync로 자동, 신규 allowlist 필요 시 PATHS 갱신
    verify:
      - node --test tests/*.test.mjs 전체 그린 + scripts/docs-drift 0 errors 0 warnings
out_of_scope:
  - 대시보드/데몬/상시 프로세스 제품화 (ecc2 경계)
  - 실시간 알림, 정기 배치/크론 (평가는 수동 스크립트 — 2026-07-10 사용자 결정)
  - 미사용 자산 자동 삭제 (평가 결과는 정리 후보 제시까지 — fail-open drop 특성상 '미사용'은 확정 아닌 후보)
  - usage 파일 retention/rotation 자동화 — 세션당 1파일·완결형이라 수동 프루닝으로 충분, 필요 시 v2
  - LLM 기반 판정 (전 층 no-LLM)
  - 타 프로젝트 과거 세션 백필
  - 서브에이전트 세션별 분리 귀속 (v2 후보)
assumptions:
  - "서브에이전트 세션에도 하네스 확장이 재바인딩된다 — 사실 (omp 16.3.15 task/executor.ts가 preloadedExtensionPaths를 child createAgentSession에 전달, child runner가 session_start emit). 미지수는 parent 연결 신호뿐 — child는 SessionManager.inMemory() 또는 <parent artifacts>/<agent>.jsonl이며 main ID 자동 필드가 없어 매핑 방법(artifacts 경로 패턴 등)은 구현 초입 실측"
  - SUM_VAULT_DIR 규약(~/projects/workspace/sum-vault) — 부재 시 global spool만으로 동작
  - custom skill message의 customType 상수는 omp 버전 간 안정적 (변경 시 fail-open + 스위트 단언으로 탐지)
risks:
  - id: R1
    desc: 이벤트당 vault append I/O가 게이트 경로에 지연 추가
    mitigation: 세션별 파일 + 단발 appendFileSync(O(1)), 구현 시 ms 측정 필드로 자가 검증
  - id: R2
    desc: upstream custom message 타입/이벤트 계약 변경으로 스킬 message 경로 무음 실패
    mitigation: fail-open 유지 + 스위트에 계약 단언 + 하네스 호환성 점검 절차(기존 관행)에 포함
  - id: R3
    desc: 동시 세션이 같은 usage 파일 경합
    mitigation: "파일 키 = aggregation_session_id — 교차 세션은 키가 달라 구조적 회피; 같은 논리 세션의 main+worker가 한 파일을 공유하는 경우는 로컬 FS O_APPEND 단문(<4KB) 원자성 + in-process 직렬화로 손실 없음(로컬 vault 전제 — 네트워크 FS는 비전제)"
  - id: R4
    desc: '지표 오독 — "차단 0%"를 준수로 오해 (게이트 미가동일 수 있음)'
    mitigation: A9 execution/decision 분리 + 리포트에 infra_error율 병기
  - id: R5
    desc: usage-log 자체가 텔레메트리 대상 아님(자기 관측 루프)
    mitigation: usage writer는 계측 제외(관측자 비대상 원칙) — 무한 재귀/노이즈 차단
