# 이슈 본문이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(bootstrap-source-only-skills-134)는 git 이력에 보존합니다.
goal: >
  #120: kickoff·startdev 스킬 본문을 #113(PR #117)·#114(PR #118)가 고친 규칙·계약에 맞춥니다.
  발견되지 않는 OMC 레거시 에이전트(critic·test-engineer·architect) 호출을 없애고, startdev Phase 0.5가
  draft seed의 사용자 승인(draft → approved, WIP 레인 단독 커밋)과 닫힌 seed의 두 재개 경로를 계약대로 안내하게 합니다.
constraints:
  - "적대 단계의 도입 상태는 .omp/rules/harness-adversarial_review.md '도입 상태'·'롤아웃 계획과 현재 위치'를 따릅니다 — 롤아웃 Phase 1(plan-attack)은 하네스가 보장하는 대응 에이전트(task)로 바꾸고, Phase 2(test-attack·completion-attack, 미승인)는 '현재 미도입'으로 명시해 건너뜁니다."
  - "완료 검증 주체는 verifier입니다(AGENTS.md Completion Contract). completion-attack을 건너뛰어도 verifier 검증은 남깁니다."
  - "draft → approved 승인과 닫힌 seed 재개 문구는 docs/rules/seed_contract.md §생애주기와 docs/rules/startdev_seed_contract.md의 문장을 그대로 씁니다."
  - "변경 파일은 .omp/skills/kickoff/SKILL.md와 .omp/skills/startdev/SKILL.md 두 개입니다(+ Stage 2 워크플로 산출물 docs/harness/ seed·scope·audit, 전역 미러 ~/.claude/skills 복사)."
acceptance_criteria:
  - id: AC1
    title: "kickoff·startdev 스킬에서 critic·test-engineer·architect 호출이 사라지고, 각 단계가 현존 에이전트(verifier·reviewer·security-reviewer·scout·task)로 바뀌거나 '현재 미도입(Phase 1)'으로 명시돼 건너뛰어집니다 — harness-adversarial_review.md 도입 상태 절과 같은 서술입니다."
  - id: AC2
    title: "startdev Phase 0.5가 draft seed를 만나면 사용자 승인을 묻고, 승인 시 status: approved 한 줄을 OMP_COMMIT_WIP=1로 커밋하는 절차가 계약 문구 그대로 들어갑니다."
  - id: AC3
    title: "startdev Phase 0.5가 done/superseded seed에서 '같은 기능 → node .omp/extensions/harness/thread-scope.mjs open, 새 기능 → /kickoff' 분기를 안내합니다."
  - id: AC4
    title: "node scripts/docs-drift 0 errors, 하네스 suite 전 항목 통과, 변경 파일은 두 스킬 + 필요 시 .omp/skills/* 전역 미러 동기화 범위 안입니다."
out_of_scope:
  - "게이트 코드 변경(별도 이슈)."
  - "문서 잔여 정합(별도 이슈) — docs/rules/, .omp/rules/harness-*.md, CHANGELOG.md는 고치지 않습니다."
assumptions:
  - "시작 HEAD는 main d86a5e1(2026.91 범프)이고 두 스킬의 레거시 에이전트 언급 9곳과 Phase 0.5의 옛 status 분기가 main에 있습니다."
  - "OMP 번들 task·security-reviewer와 하네스 verifier는 소비 리포에서도 발견됩니다(.omp/rules/harness-agent_routing.md 머리말)."
risks:
  - "이 변경 뒤 docs/rules/startdev_seed_contract.md:46('현재 startdev 스킬은 이 절과 두 군데가 다릅니다')과 .omp/rules/harness-adversarial_review.md:61·65(kickoff/SKILL.md:308의 actor: critic, '두 스킬은 발견되지 않는 에이전트 이름을 그대로 부른다')가 낡은 서술이 됩니다 — 범위 밖 파일이라 고치지 않고 PR의 Follow-ups에 적습니다."
  - "건너뛰는 단계(GATE 1.5·Completion Attack)의 절차를 본문에 남기므로 에이전트가 그 블록을 실행할 수 있습니다 — 각 절 첫 문장에 굵게 '현재 미도입 … 건너뜁니다'와 '승인 전에는 실행하지 않습니다'를 둡니다."
