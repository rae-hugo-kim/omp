  - "AC8 리뷰 증거 strict JSON 사이드카 전환 — 7차례 적대 리뷰의 CommonMark 우회 실증으로 라인 기반 마크다운 증거 파싱을 수렴 불가 판정, 게이트에서 전량 삭제(evidenceLines/failLines/makeCommentStripper/parseFields/isHetEvidence/isHumanEvidence — 게이트는 .md를 더 이상 읽지 않음). 기계 증거 = docs/reviews/review-<YYYY-MM-DD-HHMMSS>.json 사이드카의 고정 arity 위치 기반 tuple [\"omp-review-evidence/v1\", diff_hash(hex64), verdict(PASS|PASS WITH NOTES|FAIL 정확 일치), models|null, human_reviewed_by|null, reviewer] — 검증은 JSON.parse+Array.isArray+정확 arity+위치별 타입/enum/패턴 체크, 키 부재로 중복 키 last-wins 주입 구조적 불가. 증거축 택1(실측 models ≥2 distinct family 또는 human_reviewed_by 비모델명), 스키마 위반 파일은 경고 후 무시(fail-closed). override도 동일 문법 [\"omp-review-override/v1\", reason, approved_by, diff_hash|UNVERIFIABLE](-a TOCTOU 가드·audit 기록·소비 유지). BLOCK 메시지는 실제 해시가 담긴 복사 가능한 tuple 템플릿 출력, reviewer 계약은 md 보고서+json 사이드카 동시 산출(이종성 실측 계약 유지). 1차 tuple 리뷰 FAIL 대응 하드닝: 디스패처(commit-gates) fail-open 예산을 넘길 수 없도록 I/O 바운드(64KiB 초과 파일 미독 스킵, 사이드카 스캔 32개 캡, 파일별 경고 5건 캡+요약, 진단 메시지 클리핑), 미기입 <placeholder> 값 거부(증거·override 전 위치), human 스푸핑 가드 전 토큰+제로폭 문자 스캔, FAIL verdict는 증거축 면제(정직한 FAIL이 covering PASS에 밀리지 않음 — PASS만 증거축 필수), modelFamily 부정 prefix 거부(skipped/gpt-5·gpt-5-skippedrun), -a 폼 도움말이 git diff HEAD 지시. 2차 tuple 리뷰 FAIL 대응 CRITICAL 3건 봉인(3차): ① parseEvidence/parseOverride에 반복적(스택 기반) 깊이 게이트(tooDeep — 중첩 payload가 JSON.stringify/재귀 진단을 크래시시켜 디스패처 fail-open을 유도하던 경로 제거, 진단 메시지에서 비-문자열 stringify 제거, 호출부 try/catch 이중 방어) ② readBounded가 O_NOFOLLOW|O_NONBLOCK open + fstat(fd) 검사(symlink→FIFO 추적·TOCTOU 봉인, FIFO/특수파일/symlink 즉시 무효 — 증거는 평범한 정규 파일만) ③ 스캔 캡 초과는 부분 선별 대신 무조건 fail-closed BLOCK(covering FAIL 밀어내기 우회 원천 차단). HIGH 잔존(negation laundering 변종·유니코드 invisible/호모글리프 human 스푸핑·risk-assess unknown fail-open)은 위협모델상 한계효용 판정으로 수정하지 않고 리뷰 문서(review-2026-07-22-162938.md)에 후속 과제로 기록"

