goal: >
  #115: 개발 규율 문서 다섯 묶음의 모순을 코드(게이트·스크립트)에 맞춰 해소합니다 — TDD 규범 등급을
  하나로(C: 테스트 인프라가 있는 코드 로직 변경은 test-first MUST, 생략은 사용자 승인; 인프라 없음·docs-only·
