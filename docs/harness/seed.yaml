# gh-loop worker Stage 2에 따라 이슈 #71의 승인된 A+C와 AC1~AC5를 명세로 삼습니다.
# 직전 완료 seed(gh-fanout-orca-workers-66)는 git 이력에 보존합니다.
goal: >
  감사 로그의 순수 append 충돌을 로컬 union rebase로 줄이고,
  소유 워커가 PR별 승인·검증을 거쳐 순차 갱신하도록 gh-fanout·gh-loop 절차를 명확히 합니다.
constraints:
  - "docs/harness/audit.jsonl 한 경로에만 merge=union을 지정하고 기존 속성을 보존합니다."
  - "코디네이터는 순차 처리와 결정 기록을 맡고 실제 rebase·검증·갱신은 소유 워커가 맡습니다."
  - "PR별 rebase·명시적 원격 SHA lease 승인은 변경된 head의 머지 승인과 구분합니다."
  - "union 뒤에도 기존 로그 삭제·교체, 비JSON 행, 다른 파일 충돌은 중단·보고합니다."
  - "Stage 2의 체크 완료 seed·scope → 변경 → 리뷰 후속 → closeout 커밋 순서를 따릅니다."
acceptance_criteria:
  - id: AC1
    title: "git check-attr가 감사 로그만 union으로 판정하고 기존 .gitattributes 속성을 보존합니다."
  - id: AC2
    title: "격리된 임시 git 리포에서 같은 base의 두 append를 실제 rebase하여 기존 로그·두 이벤트 보존 및 모든 행의 JSON 파싱을 확인합니다."
  - id: AC3
    title: "순차 절차가 최신 base·깨끗한 작업트리·원격 SHA·원 작업 범위와 rebase 후 로그 보존·JSON을 검증하며 로그 재작성·다른 파일 충돌을 중단합니다."
  - id: AC4
    title: "PR별 rebase/force-with-lease와 새 head 머지 승인을 구분하고 match-head-commit·기존 역할·결정 기록·라벨 계약을 유지하며 GitHub union 자동 해결을 약속하지 않습니다."
  - id: AC5
    title: "최종 하네스 suite·docs-drift, 로컬 rebase 스모크 및 문서·배포 범위 확인 결과를 기록하고 소비 리포 속성 덮어쓰기나 sync 확장을 하지 않습니다."
out_of_scope:
  - "기존 PR의 실제 rebase·강제 push, 새 PR 머지, 워크트리·브랜치 삭제는 승인하지 않습니다."
  - "소비 리포 .gitattributes 전체 덮어쓰기, 감사 파일 구조 이주·과거 로그 정렬, 추가 러너 기능은 다루지 않습니다."
  - "#73~#76에서 끝난 GitHub union 원격 실험을 다시 만들지 않습니다."
  - "PR 생성·검증 근거 게시·head와 nonce 결정 요청은 커밋 뒤 후속 절차로 수행하며 AC 선체크 대상이 아닙니다."
assumptions:
  - "#71의 실측 결과를 기준으로 GitHub는 union을 통한 서버 자동 충돌 해결을 제공한다고 가정하지 않습니다."
  - "시작 HEAD는 PR #72가 머지된 068465a이고 작업트리는 깨끗하며 .gitattributes는 없습니다."
  - "sync allowlist는 두 스킬을 포함하지만 .gitattributes는 포함하지 않습니다."
risks:
  - "union은 JSON·append-only·행의 시간순서·모든 충돌 해결을 보증하지 않습니다."
  - "head가 바뀌면 이전 머지 승인은 무효이며 명시적 lease 실패도 자동 재시도하지 않습니다."
