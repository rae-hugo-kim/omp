# gh-loop worker Stage 2에 따라 이슈 #47 본문과 결정 댓글(2026-10-03 결정 1, 2026-10-06 결정 2·3)·AC (a)(b)(c)를 명세로 삼습니다.
# 직전 완료 seed(gh-loop-dispatch-closeout-record-79)는 git 이력에 보존합니다.
goal: >
  scripts/harness-version-bump.sh가 범프 때 CHANGELOG.md의 [Unreleased] 항목을 "## [<v>] - <date>" 절로 승격하고
  빈 [Unreleased] 절을 남기며, CHANGELOG 헤더 문구를 실제 규칙(앞으로 태그 기준 분할, 소급 없음)과 일치시킵니다.
constraints:
  - "소급 분할하지 않습니다: 2026.65~2026.85 누적분은 다음 범프에서 한 덩어리로 승격되도록 그대로 두고 과거 항목을 재배치하지 않습니다."
  - "변경이 없으면 no-op이고 --dry-run은 트리·인덱스·태그·HEAD를 건드리지 않습니다."
  - "실제 범프 실행·태그 발행·push는 이 작업의 범위가 아닙니다."
  - "Stage 2의 체크 완료 seed·scope → 변경 → 리뷰 후속 → closeout 커밋 순서를 따릅니다."
acceptance_criteria:
  - id: AC1
    title: "harness-version-bump.sh가 [Unreleased] 항목을 ## [<새 버전>] - <날짜>로 승격하고 빈 [Unreleased]를 남기며(메타와 같은 범프 커밋), 항목이 없거나 CHANGELOG.md가 없거나 하네스 변경이 없으면 CHANGELOG를 건드리지 않고, --dry-run은 트리를 건드리지 않음을 격리 임시 리포 스모크·테스트로 실측합니다."
  - id: AC2
    title: "CHANGELOG 헤더 문구가 실제 규칙(범프 때 승격, 소급 분할 없음, 2026.65~2026.85는 한 덩어리)과 일치합니다."
  - id: AC3
    title: "하네스 suite(node --test .omp/extensions/harness/tests/*.test.mjs)와 node scripts/docs-drift가 통과합니다."
out_of_scope:
  - "2026.65~2026.85 누적 항목의 소급 분할·재배치."
  - "실제 범프(2026.86) 실행·태그 발행·push."
  - "PR 생성·교차검증 게시·head와 nonce 결정 요청은 커밋 뒤 후속 절차이며 AC 선체크 대상이 아닙니다."
assumptions:
  - "시작 HEAD는 main 0f205a7이고 코디네이터가 agent-working을 붙였습니다."
  - "소비 리포는 CHANGELOG.md를 갖지 않으므로(init이 삭제) 파일이 없으면 승격을 건너뜁니다."
risks:
  - "범프 커밋이 pathspec으로 CHANGELOG.md를 받으므로 커밋되지 않은 수정이 쓸려 들어갈 수 있어, 그 경우 아무것도 바꾸기 전에 중단합니다."
