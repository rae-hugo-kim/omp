  - id: AC3
    title: "복잡도 초과(HIGH)·테스트 누락(MEDIUM)의 severity와 verdict 어휘(PASS / PASS WITH NOTES / FAIL)가 harness-code_review_policy 본문·severity 표·checklists/code_review.md·.omp/agents/code-reviewer.md에서 하나입니다."
