  - "init 개명 실행(선택지 제시까지 — 소비 리포 영향이라 별도 이슈)."
  - "소비 리포 동기화, 리포 밖 스킬 수정, skill-creator 파일 반입."
  - "risk-assess 부트스트랩 창 변경(결정 요청으로 올리고 사용자 답에 따릅니다)."
