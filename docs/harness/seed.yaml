  - "scripts/harness-version-bump.sh, CHANGELOG 헤더(#47 워커 소관)."
  - "gh-loop-detect.mjs의 계획 로직 변경 — 제목은 헬퍼가 접두 없이 내고 접두는 SKILL의 생성 뒤 edit에서만 붙습니다."
  - "PR 생성·교차검증 게시·head와 nonce 결정 요청은 커밋 뒤 후속 절차이며 AC 선체크 대상이 아닙니다."
