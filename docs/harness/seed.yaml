goal: >
  하네스 리뷰·검증 체계를 특정 모델 하드코딩에서 capability/롤 기반으로 개편합니다 —
  에이전트 정의는 롤 별칭으로, 이종성(heterogeneity) 증거는 실측 계약으로,
  review-gate는 3경로 증거(이종 모델 리뷰 / human review / 감사된 override)로 강제하고
  무감사 우회 경로를 제거합니다.

