# gh-loop worker Stage 2에 따라 이슈 #100 본문 끝 "승인된 작업 범위"·AC 3건과 "세션에서 직접 결정함" 댓글(2026-10-12 "ㄱㄱ")을 명세로 삼습니다.
# 직전 완료 seed(repo-root-windows-physical-resolve-99)는 git 이력에 보존합니다.
goal: >
  #100: `scripts/harness-sync.sh`의 retire 단계(7c)가 `_realfile "$f"`(pwd -P 표기)와 `"$REPO_ROOT/$path"`를 비교하는데,
  hand-off가 아닌 실행에서는 `REPO_ROOT`가 `git rev-parse --show-toplevel` 그대로라 Git for Windows(`C:/…` vs `/c/…`)에서
  비교가 항상 거짓이 되고 retired 파일이 하나도 지워지지 않을 수 있는 결함을, `REPO_ROOT`를 `_realdir`로 한 번 정규화해
  hand-off 경로(:91)와 같은 표기로 맞춥니다. `git rev-parse --show-toplevel`을 다른 표기(`<root>/.`)로 답하게 하는 git shim으로
  Linux에서 재현하는 테스트를 추가하고(수정 전 FAIL → 후 PASS), CHANGELOG [Unreleased]에 한 줄을 남깁니다.
constraints:
  - "수정은 `REPO_ROOT` 정규화 1곳(:98 인근)으로 한정합니다 — retire 알고리즘·`_cleanup`·hand-off 경로는 바꾸지 않습니다."
  - "POSIX 동작은 불변입니다 — 기존 harness-sync 테스트 전부 통과, Linux 전체 suite skip 0 유지."
  - "`:442` `TMPDIR` 백슬래시 지적은 Windows 실기 없이 확정할 수 없어 PR에 '실기 재검증 필요'로 기록만 합니다(fixture 변경 없음)."
  - "Stage 2의 체크 완료 seed·scope → 코드 커밋 → 리뷰 후속 → closeout 커밋 순서를 따릅니다."
