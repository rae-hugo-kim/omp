# gh-loop worker Stage 2에 따라 이슈 #109 본문(F1~F4, AC 5개, 범위 밖)과 코디네이터 댓글 두 건
# (2026-11-13 병합분 C2·C3·D5, 2026-11-18 추가분 아카이브 멤버 `?q=`·추가 AC)을 명세로 삼습니다.
# 2026-11-18 추가분의 `;` 목록 항목과 그 AC는 사용자 결정(2026-11-19, nonce 1795061063-30379)으로 #150에 분리했습니다.
# 이슈 본문과 댓글이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(bootstrap-source-only-skills-134)는 git 이력에 보존합니다.
goal: >
  #109: gates/read-path.mjs의 read/write 경로 해석을 omp 18.22.0에 다시 맞춥니다(기준선 18.3.0).
  read의 `?` 쿼리, 꼬리가 섞인 콤마 범위, 대문자 셀렉터, 컨테이너 멤버(아카이브·SQLite·PDF 페이지)가
  read-log에 유령 경로를 남겨 뒤따르는 edit/write가 context-gate에 거짓 차단되던 경로를 없애고,
  write에 복사된 `[path#TAG]` 래퍼가 읽지 않은 기존 파일의 덮어쓰기를 통과시키던 우회를 막습니다.
constraints:
  - "over-strip(읽지 않은 파일을 읽은 것으로 기록)은 under-strip(유령 경로 → 거짓 차단)보다 나쁜 방향입니다. 업스트림과 다르게 둘 수밖에 없는 형태는 덜 벗기는 쪽으로 둡니다."
  - "업스트림 동작은 추측하지 않고 문서(omp://tools/read.md, xd://read/sources, omp://tools/write.md), v18.22.0 소스(`packages/tui/src/tools/read.ts`, `packages/coding-agent/src/tools/{read,read-archive,hashline-header-path}.ts`), 실제 도구 실측으로 확인합니다."
  - "`readTarget(input, cwd)`은 결과의 details를 받는 `readTarget(input, details, cwd)`로 바뀌고 반환형(문자열, 기록할 것이 없으면 빈 문자열)은 그대로입니다. 이슈 AC의 `readTarget(...) → <cwd>/<file>`은 결과가 소스에 대해 아무것도 말하지 않는 경우의 문법 해석으로 검증합니다."
  - "무엇을 읽었는지는 omp가 압니다 — 읽은 파일은 결과가 싣는 경로로 기록합니다. `details.meta.source`가 `path`일 때만 파일로 보고 `details.resolvedPath`(없으면 소스 값)를 씁니다. 입력을 `;`로 쪼개거나 omp의 디스크 의존 우선순위(리터럴 파일, 아카이브·SQLite 후보)를 재현하지 않습니다. 이슈 본문이 비교를 요청한 '결과의 경로 우선, 문자열 해석은 폴백' 안입니다(r1·r2 리뷰: 입력에서 추측한 두 설계가 모두 읽지 않은 파일을 기록했습니다)."
  - "소스가 `path`가 아닌 결과와, 소스 없이 `resolvedPath`·`suffixResolution`만 실린 결과는 어떤 파일에도 귀속하지 않습니다. omp가 보고한 경로에는 입력 문법의 `?` 컷을 적용하지 않습니다(r3 리뷰 권고 두 가지, 2026-11-19 사용자 결정 A)."
  - "목록 읽기(`details.displayReadTargets`가 실린 결과)는 아무것도 기록하지 않습니다 — omp가 열기만 하고 보여 주지 않은 부분(`a.md:99999;b.md`)에도 링크를 실어 어느 부분의 내용이 표시됐는지 결과만으로 알 수 없고, 본문 헤더로 가려내는 안은 r4·r5 리뷰에서 계속 틈이 드러났습니다. 목록으로 읽은 파일은 단독으로 다시 읽어야 고칠 수 있으며 이는 #109 이전과 같은 결과입니다(목록 지원은 #150, 2026-11-19 사용자 결정 A, nonce 1795061063-30379)."
  - "문법 폴백은 결과가 소스에 대해 아무것도 말하지 않을 때만 쓰고, 그 결과보다 긴 접두(`:`나 `?` 앞, 또는 문자열 전체)가 디스크에 있으면 아무것도 기록하지 않습니다."
  - "기준 버전 문구는 2026-11-13 AC 후보가 적은 18.18.6이 아니라 실제로 대조·실측한 18.22.0으로 적습니다(2026-11-18 댓글 §4가 기준 주소·버전 문구의 갱신을 지시)."
  - "버전 범프·태그·자동 머지·force-push는 하지 않습니다."
acceptance_criteria:
  - id: AC1
    title: "F1 — `package.json?q=.scripts`, `docs/harness/audit.jsonl?q=.event&limit=5`, `logo.png?q=…`, `db.sqlite?q=SELECT …`가 쿼리를 벗긴 `<cwd>/<file>`로 풀립니다."
  - id: AC2
    title: "F2 — `editTargets('write', { path: '[src/foo.ts#1A2B]' }, CWD)`가 `[<cwd>/src/foo.ts]`를 돌려주고, context-gate가 읽지 않은 `src/foo.ts`의 덮어쓰기를 차단합니다."
  - id: AC3
    title: "F3·D5 — `attachment`·`cfg`·`security`·`vault`·`out`·`mr`이 `://`와 `:/` 양쪽에서 가상 경로로 판정돼 `readTarget`은 `''`, `localFileTarget`은 `null`입니다."
  - id: AC4
    title: "F4 — `SEARCH_ANCHOR_HEADER`가 `[path/with#hash.ts#1A2B]`를 매칭하고, `READ_SELECTOR`가 `:RAW`/`:IMG`/`:-60+10`을 벗깁니다."
  - id: AC5
    title: "C2·C3·아카이브 — `a.md:1-30,-30`·`a.md:1-30,:-30`·`doc.pdf:page3.png`·`arc.tar:member.json?q=.x`가 파일 경로만 남깁니다."
  - id: AC6
    title: "D5 — `read-path.mjs`의 문법 주석과 `harness-harness_integration_contract.md`의 미러 서술이 기준 버전 18.22.0과 기준 주소(`xd://read/sources` 포함)를 가리킵니다."
  - id: AC7
    title: "`node --test .omp/extensions/harness/tests/read-path.test.mjs`와 전체 `tests/*.test.mjs`, `node scripts/docs-drift`가 통과하고(항목별 RED→GREEN 회귀 테스트 포함) `CHANGELOG.md` `[Unreleased]`에 항목이 있습니다."
out_of_scope:
  - "`;` 목록 읽기의 부분별 기록(2026-11-18 추가분 §1과 그 AC) — #150으로 분리했습니다. 이 PR에서 목록 읽기는 아무것도 기록하지 않습니다."
  - "에이전트·문서 정합(#110)과 워크트리 CoW 상태 격리·commitTargetDir(#111)."
  - "`harness-friction`의 `references/harness-surface.md` 갱신(2026-11-17 감사 사이클 ④)."
  - "`edit`의 `MV DEST` 대상을 read-log에 넣는 것(2026-11-18 댓글 §4가 선택 사항으로 둠 — 이번에는 넣지 않습니다)."
  - "`edit.citationTags` 활성화 시의 `HASHLINE_HEADER` 재검(#10)."
  - "`~` 확장·`file://`·`www.` 대상·suffix 해석처럼 이번 감사가 지목하지 않은 기존 경로 형태."
  - "`write`의 컨테이너 대상(`arc.tar:member`, `db.sqlite:table[:key]`)을 컨테이너 파일로 게이트하는 것과 `edit` 직접 경로의 래퍼 언래핑 — r1 리뷰가 지목한 기존 결함으로 이슈 범위 밖입니다(후속 이슈 권고)."
assumptions:
  - "시작 HEAD는 main d86a5e1(2026.91 범프)이고 `read-path.mjs`는 3dc461e 이후 변경이 없습니다."
  - "설치된 omp는 18.22.0이며 실측은 이 버전의 `read`/`write` 도구로 했습니다."
  - "성공한 로컬 단일 `read` 결과는 읽은 파일의 절대 경로를 싣습니다 — 일반 텍스트는 `details.meta.source`(type `path`), 쿼리·SQLite·이미지·아카이브·suffix 해석은 `details.resolvedPath`와 path 소스에. 목록 결과는 `details.displayReadTargets`로 표시됩니다. omp 18.22.0 소스(`readDetailsLinkPath`)와 이 호스트의 최근 세션 기록을 최종 `readTarget`으로 재생해 확인했습니다(2026-11-19, 세션 파일 1,500개에서 입력과 짝지은 성공 read 결과 34,843건: path 소스 단일 읽기 27,139건 중 27,118건이 보고된 파일 그대로 기록되고 나머지 21건은 URL로 주소를 준 읽기라 기록 없음, 불일치 0건·예외 0건, 문법 폴백 도달 0건, 목록 99건과 path가 아닌 소스 7,571건은 기록 0건). JSON·PDF로 읽은 아카이브 멤버만 `<아카이브>:<멤버>`로 보고되고, 범위 밖 셀렉터 안내는 소스 없이 `resolvedPath`만 싣습니다(같은 재생에서 34건, 전부 'beyond end of file' 안내 — 내용을 보여 주지 않은 읽기)."
  - "`v18.18.9`의 `parseXdUrl`은 확장 런타임 API라 node로 도는 `.mjs` 모듈·테스트에서 쓸 수 없어 스킴 allowlist를 유지합니다."
risks:
  - "셀렉터·컨테이너 확장자·스킴 목록은 omp 버전에 묶여 있습니다 — 새 형태는 유령 경로(거짓 차단)로 퇴화하므로 omp 업그레이드마다 재대조합니다."
  - "`readTarget`이 `existsSync`를 씁니다(보고된 `<아카이브>:<멤버>`를 아카이브로 줄일 때, 문법 폴백의 모호성 확인) — 모듈이 더는 순수 함수 층이 아닙니다(통합 계약 문서에 반영)."
  - "읽기 추적은 omp 18.22.0의 결과 형태(`resolvedPath`·`meta.source`·`displayReadTargets`)에 묶여 있습니다 — 형태가 바뀌면 문법 폴백이나 '기록 없음'으로 퇴화합니다(둘 다 거짓 차단 방향). 단, 목록 표시(`displayReadTargets`)가 사라지고 소스 정보도 없으면 목록 입력이 문법 폴백으로 가 유령 경로 하나가 됩니다(이전과 같은 결과)."
  - "업스트림 splitter와의 알려진 차이 두 가지: `:-N+C` 상위집합(AC 요구 — 로컬 read는 업스트림에서 오류라 추적되지 않음), 문서에 없는 `N:M` 목록 병합 미반영(덜 벗기는 방향)."
  - "목록 읽기 뒤의 edit/write는 여전히 거짓 차단됩니다(#109 이전과 같음) — #150이 닫힐 때까지 목록으로 읽은 파일은 단독으로 다시 읽어야 합니다."
  - "이 세션에 로드된 확장은 옛 코드입니다 — 실제 게이트 동작은 핸들러 테스트로 검증하고, 새 세션부터 적용됩니다."
