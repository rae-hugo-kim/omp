# 이슈 #58 끝의 승인 범위·AC 5건과 astra dispatch(2026-10-13T04:17:44Z)를 따릅니다.
# 직전 완료 seed는 git 이력에 보존합니다.
goal: >
  backpressure 기록 위치를 세션 cwd에서 검증·편집 대상 워크트리의 repoToplevel로 바꿉니다.
  bash의 구조화 cwd와 선행 리터럴 cd를 해석하고, 해석 불가 또는 저장소 밖이면 기록을 생략합니다.
  편집은 파일 경로로 귀속하며 hook mode의 커밋 워크트리 기준 판정은 바꾸지 않습니다.
constraints:
  - "다른 gh-loop-issue-58* 브랜치를 조회하거나 참고하지 않습니다."
  - "사용자가 제공한 재현을 RED 근거로 삼고 테스트를 먼저 작성합니다. suite는 변경 완료 후 한 번 실행합니다."
  - "기존 chdir·cdTarget 경로 해석과 repoToplevel을 재사용하며 범용 shell 해석기를 만들지 않습니다."
  - "기록 생략은 HARNESS_DEBUG 로그로 알리고 세션 cwd로 폴백하지 않습니다."
acceptance_criteria:
  - id: AC1
    title: "세션 A에서 bash(cwd=B)·cd B && 검증의 PASS/FAIL이 B에만 기록되고 A는 불변입니다. 실제 index.ts 핸들러 캡처로 검증합니다."
  - id: AC2
    title: "B의 편집은 B만 UNKNOWN으로 만듭니다. 링크드 워크트리도 별도 state dir을 사용하며 hook mode는 커밋 워크트리 상태만 읽습니다."
  - id: AC3
    title: "해석 불가 cwd·저장소 밖 cwd는 backpressure 상태를 쓰지 않으며 HARNESS_DEBUG에서 생략을 알립니다."
  - id: AC4
    title: "단일 워크트리 회귀가 없고 Linux suite skip 0 및 최종 docs-drift 0/0을 확인합니다. 이종 모델 reviewer 3-pass와 verifier 판정을 확보합니다."
  - id: AC5
    title: "#51 서브에이전트 격리·#45 service 라우팅·#57 verify-commands를 변경하지 않습니다. 운영 규칙 1단락과 astra dispatch 감사 기록을 남깁니다."
out_of_scope:
  - "검증 내용과 작업 트리 해시의 결속 및 서브에이전트 상태 격리(#51)."
  - "service·비동기 결과 라우팅(#45) 및 verify-commands 분류·레지스트리 변경(#57)."
  - "커밋·push·PR·closeout은 검증 뒤 절차이며 머지는 새 승인 전 금지합니다."
assumptions:
  - "시작 HEAD는 main 54eabe1f129ae3365344859ab3a1dc31fb6f9049이며 작업 트리는 깨끗했습니다."
  - "shell 내부의 임의 스크립트나 runner가 실행 도중 바꾸는 cwd는 정적으로 알 수 없습니다."
