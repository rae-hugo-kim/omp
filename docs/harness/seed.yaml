  - "8단계 평가는 서브에이전트 실행이라 비결정적이고 프롬프트당 1회라 참고용입니다."
  - "init 제거 목록에 넣은 스킬 디렉터리 삭제는 risk-assess 부트스트랩 창 밖이라 init 첫 커밋이 high로 채점됩니다 — 게이트 변경 여부는 결정 요청입니다."
