  - "이 호스트의 점검 결과는 20건(omp 18.18.6)이며, 그중 REF-PATH-gh-loop-3861db는 근거가 하나로 모여(orca-cli는 ~/.agents/skills의 설치형 스킬, gh-fanout이 skill://orca-cli로 참조, 리포 이력에 그 경로 없음) 기계적으로 분류했습니다."
