    reason: 이번 사이클의 범위·AC·확인 문장(2026-11-13 범위 확정 댓글)
  - path: .omp/extensions/harness/gates/harness-version-check.mjs
    reason: 구현 위치와 따라야 할 프로브·마커 방식
  - path: .omp/extensions/harness/tests/drift-recheck-wiring.test.mjs
    reason: session_start 호출만 max_age_ms를 넘기지 않는다는 배선 계약
