name: autonomy-finding-detection
status: draft
version: 1
task_id: "20260619-142403-fddb"
goal: >
  자동탐지(Q2.7-4) — gh-loop의 **입력 자동화**: 소스(Q1 breadcrumb의 FAIL 등, 그리고 lint/리뷰
  발견)에서 finding을 추출 → dedup/throttle → gh-loop 이슈로 자동 생성한다. 수동 킥오프(지목) 대신
  소스가 finding을 공급. **테스트가능 추출/계획 헬퍼**(소스 read·gh 호출은 seam; decideIssue 재사용)로
  검증 — 라이브 GitHub 불필요. breadcrumb 어댑터 우선 + 제네릭 findings-JSON 입력으로 lint/리뷰 확장.
  *언제* 자동탐지를 도느냐(스케줄/트리거)는 option-A 런타임·per-project 몫(out_of_scope). (자율화 Q2.7-4)

context:
  source: claudedocs/harness-auto-capture-analysis.md#Q2.6,Q2.7-4,Q2.8
  date_locked: 2026-06-19
  related_docs:
    - claudedocs/harness-auto-capture-analysis.md          # Q2.6(breadcrumb=finding 소스), Q2.7-4(자동탐지), Q2.8(소스 선택)
    - .omp/extensions/harness/gates/breadcrumb-tracker.mjs  # session-log.jsonl 스키마(FAIL 엔트리)
    - .omp/extensions/harness/gh-loop-issue.mjs             # decideIssue(dedup/throttle) 재사용
    - .omp/skills/gh-loop/SKILL.md                          # Stage 1 생성 경로(auto-detect 진입 추가)

constraints:
  - 추출/계획만 — gh 이슈 생성은 기존 gh-loop Stage 1 경로 재사용(신규 생성 로직 금지)
  - decideIssue 재사용 — dedup(마커+제목, kind-scoped)·throttle(런당 상한)을 그대로 활용
  - 노이즈 억제 — FAIL 후 동일 type PASS면 resolved로 보고 finding 제외; 배치 내 동일 finding 1개
  - 소스 read·gh 호출은 seam(주입) — 라이브 없이 단위테스트
  - 위험 변경은 커밋 전 연속 이종(codex 포함) 리뷰 (het-gate 정책)

in_scope:
  - `.omp/extensions/harness/gh-loop-detect.mjs` — `fromBreadcrumb(entries)`→findings, `planIssues(findings,{existing,cap})`→decisions(decideIssue 재사용, 배치 dedup + throttle), CLI
  - breadcrumb 어댑터 — `session-log.jsonl`의 `result:'FAIL'`(test/commit) 추출, FAIL→later-PASS suppression
  - 제네릭 findings 입력 — `--from json`({title,body,labels}) 으로 lint/리뷰/테스트결과 확장
  - gh-loop SKILL에 auto-detect 진입 명문화(수동 킥오프 대안)
  - 전파: 헬퍼 `.omp/extensions/harness/`(sync 통째)

out_of_scope:
  - 스케줄/트리거(언제 자동탐지 도느냐) — option-A 런타임·per-project(cron/workflow)
  - 라이브 이슈 생성 — 기존 gh-loop Stage 1(gh CLI) 경로가 담당
  - lint/리뷰 파서 자체 — 제네릭 findings-JSON 입력만 받음(파싱은 호출자)
  - finding 품질 판정/ML/우선순위 — 단순 추출 + dedup/throttle만

assumptions:
  - breadcrumb session-log.jsonl 스키마 = `{ts,kind:'commit'|'test'|'edit'|'scope',result?,type?,cmd?,hash?,file?}` (breadcrumb-tracker.mjs L28-56)
  - decideIssue 시그니처/동작 안정(gh-loop-issue.mjs) — finding당 1회 호출로 계획

acceptance_criteria:
  - id: AC1-detect-core
    title: 추출+계획 헬퍼
    source: "analysis Q2.7-4 (L156); gh-loop-issue.mjs decideIssue 재사용"
    must:
      - "`planIssues(findings,{existing,cap})` — finding마다 decideIssue 호출, **배치 내 생성분을 existing에 누적**해 같은 배치 중복도 dedup, throttle 적용"
      - 반환 = 각 finding의 {action: create|skip|block, payload?} 계획
    verify:
      - 신규 finding→create, 동일 finding 2건→1 create+1 skip, 상한 초과→block 단위테스트
  - id: AC2-breadcrumb-adapter
    title: breadcrumb 어댑터 (per-FAIL 추출; 노이즈는 dedup/cap)
    source: "analysis Q2.6 (L150); breadcrumb-tracker 스키마; het-review(coarse type)"
    must:
      - "`fromBreadcrumb(entries)` — `result:'FAIL'` test/commit를 finding으로(type은 trim/lower 정규화)"
      - "**coarse type(test/lint/build) 때문에 FAIL→PASS suppression 안 함** — 다른 suite를 가려 real failure를 놓치므로(false-negative). 동일 title로 emit하고 planIssues dedup + cap + triage가 노이즈 처리"
      - PASS-only / edit / scope 엔트리는 finding 아님
    verify:
      - FAIL test→finding, FAIL 뒤 same-type PASS여도 emit(suppression 안 함), 동일 type 여러 FAIL→제목 동일(dedup) 단위테스트
  - id: AC3-generic-input
    title: 제네릭 findings 입력 (lint/리뷰 확장)
    source: "analysis Q2.7-4 (리뷰/린트→이슈)"
    must:
      - "CLI `--from json --findings-json '[{title,body,labels}]'` 지원 → planIssues로 전달"
      - 어댑터 추가 없이 외부 소스(lint/리뷰/테스트) 연결 가능
    verify:
      - json 입력이 planIssues 계획으로 이어지는 CLI 테스트
  - id: AC4-dedup-throttle
    title: dedup/throttle 재사용
    source: ".omp/extensions/harness/gh-loop-issue.mjs"
    must:
      - 기존 열린 이슈 대조 dedup + 배치 내 dedup + 런당 throttle(cap)
    verify:
      - existing와 중복인 finding→skip, cap 초과 findings→block 단위테스트
  - id: AC5-skill-wiring
    title: 스킬 auto-detect 진입
    source: ".omp/skills/gh-loop/SKILL.md Stage 1 (수동 킥오프 대안)"
    must:
      - gh-loop SKILL에 "auto-detect" 진입(breadcrumb/json → planIssues → Stage 1 생성) 명문화; 생성은 기존 경로
    verify:
      - 스킬에 auto-detect 절차 + 기존 Stage 1 재사용 명시
  - id: AC6-propagation
    title: 전파
    source: "harness-sync PATHS(.omp/extensions/harness 통째)"
    must:
      - 헬퍼가 `.omp/extensions/harness/`에 위치(sync 통째); 신규 스킬 아님→PATHS 변경 불필요
    verify:
      - 위치 확인; `node scripts/docs-drift` 0/0

decisions:
  adapter_pattern:
    value: "source 어댑터(breadcrumb 우선) + 제네릭 findings-JSON"
    reason: "Q2.6 breadcrumb 연계가 구체+실재; lint/리뷰는 제네릭 JSON으로 확장(파서는 out_of_scope)."
    status: confirmed
  reuse_decision:
    value: "decideIssue 재사용, planIssues는 배치 래퍼"
    reason: "dedup/throttle 로직 중복 금지 — gh-loop-issue.mjs가 SSOT."
    status: confirmed
  noise_suppression:
    value: "suppression 안 함(coarse type) — emit + 제목 dedup + 기본 cap=5 + triage"
    reason: "het-review: breadcrumb type이 coarse(test/lint/build)라 FAIL→PASS suppression이 다른 suite의 real failure를 false-negative로 가림. 검출기엔 false-negative가 더 나쁘므로 emit하고 dedup/cap로 폭주만 막음. 정밀 suppression은 breadcrumb가 command까지 기록해야(future)."
    status: confirmed
  scope_extract_only:
    value: "추출+계획만, 생성은 기존 Stage 1"
    reason: "단일 책임; 라이브 생성은 검증 불가(seam)·기존 경로 재사용."
    status: confirmed

risks:
  - id: R1
    desc: 고쳐진 일시 FAIL을 finding으로 만들어 노이즈
    mitigation: 제목 dedup(동일 FAIL 1이슈) + 기본 cap=5 throttle + triage가 닫음(coarse type라 suppression은 안 함; AC2/AC4)
  - id: R2
    desc: 어느 FAIL이 "이슈감"인지 과/과소 판정
    mitigation: PoC는 단순 규칙(미해결 FAIL=후보) + 인간/루프 triage; 품질판정은 out_of_scope
  - id: R3
    desc: 스케줄 없이 추출만이면 "자동"이 반쪽
    mitigation: 스케줄/트리거는 option-A 런타임 몫으로 명시(out_of_scope); 본 작업은 입력 *로직* 완성

references:
  - path: claudedocs/harness-auto-capture-analysis.md
    reason: Q2.6/Q2.7-4/Q2.8 = 본 seed 원본
  - path: .omp/extensions/harness/gates/breadcrumb-tracker.mjs
    reason: session-log.jsonl 스키마(어댑터 입력)
  - path: .omp/extensions/harness/gh-loop-issue.mjs
    reason: decideIssue(dedup/throttle) 재사용
