name: autonomy-multisession-controller
status: draft
version: 1
task_id: "20260619-153030-f28d"
goal: >
  Q3 멀티세션 = Q2 루프의 **exec 엔진**. 얇은 컨트롤러가 이슈/태스크를 **worktree-격리 워커 세션**
  (`omp --mode rpc` 별도 프로세스)으로 fan-out하고, **GitHub를 관측·coarse-조정 평면**(라벨 상태 +
  코멘트 마일스톤[throttle] + 트래킹 이슈[풀])으로 쓰며, **동적 스케일**(cap=설정가능 천장, 기본 3,
  1~cap)한다. 본 작업은 **테스트가능 컨트롤러 결정로직**(planPool/nextScale/assign) + worktree 배선 +
  얇은 RPC spawn 절차를 저작한다(gh/git/spawn은 seam). 라이브 N워커 실주행은 옵션(비용 N배). tmux 없음
  (관측은 GitHub). 얇은 RPC 오케스트레이터로 한정 — 데몬/대시보드 제품화 금지(레포 ecc2 경계). (자율화 Q3)

context:
  source: claudedocs/harness-auto-capture-analysis.md#Q3
  date_locked: 2026-06-19
  related_docs:
    - claudedocs/harness-auto-capture-analysis.md          # Q3.1-Q3.9 (개념·substrate·스케일·caveat·tmux/WSL)
    - .omp/extensions/harness/gh-loop-issue.mjs             # dedup/throttle 재사용(워커 로깅 rate-limit 가드)
    - .omp/extensions/harness/gh-loop-runner.mjs            # event→start/resume(워커가 이슈 잡는 라우팅)
    - .omp/extensions/harness/gh-loop-detect.mjs            # finding→이슈→워커 할당
    - omp://rpc.md                                          # omp --mode rpc substrate(빌드 시 정독)

constraints:
  - 워커 = `omp --mode rpc` 별도 프로세스(격리+구조화 이벤트). `task`/in-proc 아님(멀티세션 정의, Q3.1)
  - 워커 FS 격리 = git worktree 1개 / 워커 / 이슈 (병렬 편집·커밋 충돌 방지)
  - 관측·coarse 조정 = GitHub (irc는 프로세스-로컬이라 별도 세션 간 X; Q3.6). 워커끼리 직접 통신 X
  - 컨트롤러 = 로컬 온디맨드(이 박스, systemd 가능). 24/7 상시응답은 분리(robo-omp/cloud; Q3.9 ⚠️)
  - 동적 스케일: cap=설정가능 천장(기본 3), 1~cap. 신호 = risk-assess/diff LOC/태스크 수/라벨 (Q3.5)
  - 비용 N배 → cap + 예산 가드; 워커 GitHub 로깅은 gh-loop-issue throttle/dedup 재사용(폭주·rate-limit 방지)
  - 얇은 RPC 오케스트레이터 한정 — 대시보드/데몬 금지(Q3.6/Q2.3-B ecc2 경계)
  - 머지 자동 금지 불변식 유지; het(codex 포함) 리뷰 후 커밋

in_scope:
  - `.omp/extensions/harness/gh-loop-controller.mjs` — 테스트가능 결정로직(gh/git/spawn seam):
    - `planPool(tasks, { signals, cap })` → 워커 할당 계획(워커 수·이슈·role)
    - `nextScale(state, { signals, cap })` → up/down/hold/retire 결정
    - `assign(issues, { claimed })` → 이슈↔워커 매핑, 이미 claim된 이슈 중복할당 방지
  - 컨트롤러 스킬 — worktree-per-worker + `omp --mode rpc` spawn + 이벤트 모니터 + GitHub 로깅(라벨/코멘트/트래킹) + 동적 스케일 절차 (신규 스킬 또는 gh-loop fan-out 섹션)
  - 전파: 헬퍼 `.omp/extensions/harness/`(sync 통째); 신규 스킬이면 harness-sync PATHS 등록

out_of_scope:
  - 라이브 N워커 실주행 E2E (옵션; 비용 N배 — 결정로직은 단위테스트로 검증)
  - 24/7 상시 컨트롤러 (robo-omp/cloud; Q3.9 ⚠️행)
  - 워커↔워커 직접 실시간 통신 (이슈 단위 분할로 대부분 불요; fine-relay는 컨트롤러 경유)
  - `omp --mode rpc` 프로토콜 변경 (기존 substrate 그대로 사용)
  - 대시보드/데몬/컨트롤플레인 제품화 (ecc2 경계)

assumptions:
  - `omp --mode rpc`가 `new_session`/prompt/이벤트 스트림/host-tool 제공(Q3.2; omp://rpc.md)
  - gh 인증 + git worktree 가용(이 박스 실측: systemd·tmux·gh repo scope)
  - 워커 결과 집계 = RPC 이벤트(agent_end/tool_*) + GitHub 아티팩트

acceptance_criteria:
  - id: AC1-pool-shape
    title: planPool 결정로직
    source: "analysis Q3.4·Q3.5 (L230,238)"
    must:
      - "`planPool(tasks, {signals, cap})` → 워커 할당 계획(이슈별 워커, role) — cap 상한 준수"
      - 신호(risk/diff LOC/태스크 수)로 워커 수 결정; gh/spawn은 seam
    verify:
      - 신호↑→워커수↑(≤cap), cap 초과 요청→cap에서 캡, 빈 tasks→빈 계획 단위테스트
  - id: AC2-dynamic-scale
    title: nextScale 결정로직
    source: "analysis Q3.5 (team scale_up/down 선례)"
    must:
      - "`nextScale(state, {signals, cap})` → up/down/hold/retire (cap 천장, idle drain)"
    verify:
      - 부하↑+여유→up(≤cap), cap 도달→hold, idle 워커→down/retire 단위테스트
  - id: AC3-assignment
    title: 중복할당 방지 assign
    source: "analysis Q3.6 (GitHub 조정); gh-loop 라벨 claim"
    must:
      - "`assign(issues, {claimed})` → 이슈↔워커 매핑; 이미 claim된(처리중 라벨) 이슈는 skip"
    verify:
      - 미claim 이슈→배정, claim된 이슈→skip(중복 방지) 단위테스트
  - id: AC4-worktree-rpc-wiring
    title: worktree + RPC spawn 절차
    source: "analysis Q3.1·Q3.2·Q3.4 (격리 워커 substrate)"
    must:
      - 스킬에 worker당 `git worktree add wt/issue-N -b gh-loop/issue-N` + `omp --mode rpc` 자식 spawn + 이벤트 모니터 절차 명문화 (gh/git/spawn seam)
      - 워커 크래시/완료 시 worktree 정리(retire)
    verify:
      - 스킬에 worktree-per-worker·RPC spawn·이벤트 모니터·정리 절차 존재
  - id: AC5-github-observability
    title: GitHub 관측·조정 평면
    source: "사용자 결정(라벨+코멘트+트래킹); Q3.6"
    must:
      - 워커 진행 = 라벨(상태) + 코멘트(마일스톤, **gh-loop-issue throttle/dedup 재사용**) + 트래킹 이슈(풀 집계)
      - 머지 자동 금지 유지; tmux 미사용(관측은 GitHub)
    verify:
      - 스킬에 라벨/코멘트(throttle)/트래킹 이슈 로깅 + 머지 인간승인 명시
  - id: AC6-propagation
    title: 전파
    source: "harness-sync PATHS"
    must:
      - 헬퍼 `.omp/extensions/harness/`(통째 sync); 신규 스킬이면 PATHS + README 등록
    verify:
      - 위치/등록 확인; `node scripts/docs-drift` 0/0

decisions:
  worker_runtime:
    value: "omp --mode rpc 별도 프로세스"
    reason: "사용자 결정 — 격리 + 구조화 이벤트(집계·중계 깔끔). task/in-proc은 멀티세션 아님."
    status: confirmed
  controller_tier:
    value: "로컬 온디맨드(이 박스)"
    reason: "사용자 결정 — Q3.9: on-demand는 현 박스 충분(systemd). 24/7은 robo-omp/cloud로 분리."
    status: confirmed
  observability:
    value: "GitHub: 라벨(상태)+코멘트(마일스톤,throttle)+트래킹 이슈(풀); tmux 없음"
    reason: "사용자 결정 — headless 가시성을 GitHub로 보완(내구·원격·비동기). irc 프로세스-로컬이라 버스로 부적합."
    status: confirmed
  concurrency:
    value: "cap=설정가능 천장, 기본 3, 동적 스케일이 1~cap"
    reason: "사용자 결정 — 시스템 한계 아님(진짜 한계=API rate/예산, ~10-20+ 가능). 기본 보수, 상향가능."
    status: confirmed
  build_scope:
    value: "저작+테스트가능 로직(planPool/nextScale/assign)+worktree 배선+얇은 RPC spawn; 라이브 N워커 옵션"
    reason: "사용자 결정 — 결정로직은 단위테스트로 완결 검증; 라이브 다중구동은 비용 N배라 옵션."
    status: confirmed

risks:
  - id: R1
    desc: ecc2 류 데몬/컨트롤플레인으로 비대화
    mitigation: 얇은 RPC 오케스트레이터 한정(대시보드/상시데몬 금지) — out_of_scope 명시
  - id: R2
    desc: 라이브 미검증(결정로직만 테스트)
    mitigation: planPool/nextScale/assign 단위테스트 + spawn/git/gh seam; 라이브 N워커는 옵션(이 박스 가능, 비용)
  - id: R3
    desc: 워커 로깅이 GitHub API rate-limit/이슈 폭주
    mitigation: gh-loop-issue throttle/dedup 재사용 + cap + 마일스톤만(상세는 로그)
  - id: R4
    desc: 비용 N배 폭주
    mitigation: cap(기본 3) + 동적 스케일 + 예산 가드

references:
  - path: claudedocs/harness-auto-capture-analysis.md
    reason: Q3 전체(개념·substrate·스케일·caveat·tmux/WSL) = 본 seed 원본
  - path: .omp/extensions/harness/gh-loop-issue.mjs
    reason: 워커 로깅 throttle/dedup 재사용
  - path: omp://rpc.md
    reason: omp --mode rpc substrate(빌드 시 정독)
