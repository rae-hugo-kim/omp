# gh-loop worker Stage 2에 따라 이슈 #127 본문("만들 것" 1~4, "정해 둔 것", AC 7개, "범위 밖")을 명세로 삼습니다.
# 이슈 본문이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(adversary-panel-cycle2-112)는 git 이력에 보존합니다.
goal: >
  #127: 하네스 스킬을 점검하는 스킬 harness-skill-tune의 점검 단계를 만듭니다 — 스킬별 호출 빈도 집계,
  omp 예약 이름·다른 출처 스킬과의 이름 충돌, SKILL.md 본문 정합을 결정적으로 판정해 보고서 하나(스킬별 표 + 지적 목록)로 냅니다.
  스킬 파일을 고치지 않는 읽기 전용 단계이며, 보고서는 다음 사이클(갱신)의 입력입니다.
constraints:
  - "스킬 이름은 harness-skill-tune입니다(omp 빌트인 명령·CLI 하위 명령·번들 에이전트·로드된 스킬과 겹치지 않음 — 이슈에서 확정)."
  - "리포 밖 스킬(~/.agents/skills, ~/.claude/skills, ~/.omp/agent/skills 등)은 충돌 판정의 입력으로만 읽습니다. 지적 대상은 이 리포의 .omp/skills/입니다."
  - "소스 리포 전용입니다 — scripts/harness-sync.sh 화이트리스트에 넣지 않습니다. 기존 테스트나 문서 검사가 전수 등재를 요구하면 고치지 않고 결정 요청으로 올립니다."
  - "skill-creator(Claude Code 플러그인)는 작성 절차의 참고로만 쓰고 그 파일을 리포로 가져오지 않습니다."
  - "결정적으로 판정되는 것만 스크립트로 하고, 설명문 품질처럼 판단이 필요한 항목은 스킬 본문의 절차로 둡니다."
  - "세션 디렉터리는 PI_CODING_AGENT_DIR을 따릅니다."
acceptance_criteria:
  - id: AC1
    title: ".omp/skills/harness-skill-tune/SKILL.md가 있고, frontmatter name이 디렉터리명과 같으며 description이 있습니다."
  - id: AC2
    title: "빈도 집계를 픽스처 세션 디렉터리에 돌리면 스킬마다 세션 수·읽기 횟수·마지막 사용일·/skill: 호출 수가 나오고, 읽기 0회인 스킬이 0으로 표시되며, 하위 경로 읽기(skill://x/ref.md)가 x에 귀속됩니다."
  - id: AC3
    title: "세션 디렉터리가 없거나 command_usage를 읽을 수 없으면 그 열을 측정 불가로 표시하고 실패 없이 끝납니다."
  - id: AC4
    title: "이름 충돌 검사가 픽스처에서 예약 이름과 같은 스킬, 출처 간 같은 이름 사본을 각각 지적으로 냅니다."
  - id: AC5
    title: "본문 정합 검사가 픽스처에서 없는 경로 참조, 없는 /skill: 참조, name과 디렉터리명 불일치를 각각 지적으로 냅니다."
  - id: AC6
    title: "보고서가 지적마다 ID·심각도·스킬·근거(파일:줄)·기계적 수정 가능 여부를 담습니다."
  - id: AC7
    title: "node --test .omp/extensions/harness/tests/*.test.mjs와 node scripts/docs-drift가 통과하고, CHANGELOG.md의 [Unreleased]에 항목이 있습니다."
out_of_scope:
  - "스킬 수정·개명·삭제·숨김, 스킬 유무 비교 평가(다음 이슈인 갱신 단계)."
  - "init 개명(소비 리포로 동기화되는 스킬이라 별도 결정)."
  - "소비 리포 동기화(harness-sync.sh 화이트리스트)."
  - "리포 밖 스킬 파일 수정 — closeout_contract §4의 전역 미러(~/.claude/skills) 복사도 하지 않습니다."
  - "skill-creator 파일 반입."
assumptions:
  - "시작 HEAD는 main 2f136f3이고 이슈의 실측은 omp 18.18.6 WSL 호스트 기준입니다."
  - "omp 업스트림 저장소는 can1357/oh-my-pi이고 v18.18.6 태그에 packages/coding-agent/src/slash-commands/builtin-*.ts가 있습니다(gh api로 확인)."
  - "CI(harness-ci)의 Node 22에서 node:sqlite가 플래그 없이 로드됩니다. 로드되지 않으면 command_usage 테스트는 skip하고 스크립트는 그 열을 측정 불가로 냅니다."
risks:
  - "세션 기록 형식은 omp 내부 형식입니다 — read 호출이 assistant toolCall과 tool_execution_start 두 레코드로 남는 현재 형식과, toolCall만 있는 옛 형식 둘을 읽습니다. 형식이 바뀌면 읽기 수가 0으로 떨어질 수 있습니다."
  - "예약 이름 스냅샷은 업스트림 소스의 들여쓰기에 기대어 최상위 명령과 하위 명령을 가릅니다. 형식이 바뀌면 refresh-reserved가 20개 미만에서 실패하도록 막았지만 부분 누락은 못 잡습니다."
  - "경로·에이전트 참조 추출은 패턴 기반이라 재현율이 제한됩니다(코드 블록 안 경로, 백틱 없는 에이전트 이름 일부)."
  - "테스트 파일은 .omp/extensions/harness/tests/에 있어 소비 리포로 동기화됩니다 — 스킬이 없으면 skip합니다(docs-drift.test.mjs와 같은 방식)."
