# gh-loop worker Stage 2에 따라 이슈 #122 본문("항목" 1~2, AC 5개, "범위 밖")과 코디네이터 댓글(2026-11-18, #61을 이 워커가 함께 처리 — 사용자 승인)을 명세로 삼습니다.
# 이슈 본문과 그 댓글이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(skills-kickoff-startdev-contract-align-120)는 git 이력에 보존합니다.
goal: >
  #122·#61: acceptance-gate의 closeout landing이 HEAD seed의 객체형 AC id가 은퇴되는 current-scope.md에 전부 있는지 확인해
  thread-scope open --ac 부분 스레드의 closeout을 기계적으로 막고(#114 잔존면 해소), 평시 판정(Check 3)이 워크트리 파일만 읽지 않고
  커밋이 담는 scope와 디스크의 scope 가운데 미체크가 많은 쪽을 판정하게 합니다. 두 게이트의 헤더 주석을 실제 배선으로 고치고 계약 문서를 코드와 맞춥니다.
constraints:
  - "thread-scope.mjs의 동작은 바꾸지 않습니다 — 게이트가 parseAC와 같은 문법으로 seed를 읽고, 테스트가 실제 thread-scope.mjs로 scope를 생성해 두 판독의 일치를 고정합니다."
  - "객체형 id가 없는 seed(문자열형 AC)는 기존 체크박스 판정을 유지합니다 — fail-open 범위를 테스트로 고정합니다."
  - "Check 3는 커밋이 담는 scope와 디스크의 scope를 둘 다 읽어 미체크가 많은 쪽을 판정합니다(사용자 결정 B, 2026-11-19 — #61이 적은 'plain commit은 인덱스 본' 규칙을 대체). 커밋이 scope를 담지 않는 경우(untracked·intent-to-add·스테이지된 삭제)는 디스크 파일만 판정합니다."
  - "자동 머지·버전 범프·태그·force-push를 하지 않습니다(gh-loop worker 모드)."
acceptance_criteria:
  - id: AC1
    title: "두 게이트(acceptance-gate.mjs·backpressure-gate.mjs)의 헤더 주석이 실제 배선(commit-gates.mjs hook mode, .githooks/pre-commit)을 서술합니다."
  - id: AC2
    title: "acceptance-gate closeout landing이 HEAD의 seed AC id 집합 ⊆ 은퇴 scope의 AC id 집합을 확인하고, 부족하면 빠진 id를 이름으로 내며 BLOCK합니다. seed가 AC id를 갖지 않는 문자열형이면 기존 판정을 유지합니다(fail-open 범위를 테스트로 고정)."
  - id: AC3
    title: "RED→GREEN 회귀 테스트: --ac 부분 scope로 closeout → BLOCK, 전체 AC scope → allow, 문자열형 AC seed → 기존 동작. acceptance-gate.test.mjs 전부 통과합니다."
  - id: AC4
    title: "harness-harness_integration_contract.md의 #114 잔존면 단락이 기계 강제됨으로 바뀌고 docs/rules/closeout_contract.md §2와 맞습니다."
  - id: AC5
    title: "하네스 suite 전 항목이 통과하고 node scripts/docs-drift가 0 errors입니다."
  - id: AC6
    title: "#61 — Check 3가 커밋이 담는 scope와 디스크의 scope 가운데 미체크가 더 많은 쪽을 판정합니다(plain commit·훅 모드·판정 불가 형태 공통, -a는 워크트리 본): 스테이지된 미체크 + 워크트리 체크 + 코드 변경은 BLOCK, 커밋된 전부-체크 scope + 디스크에만 있는 미체크 scope + 코드 변경도 BLOCK(양방향 회귀 테스트)."
out_of_scope:
  - "스킬·문서 잔여 정합(kickoff Step 6 scope 템플릿의 id 표기, compr/compush closeout 요약 등 — 별도 이슈)."
  - "thread-scope.mjs 동작 변경."
  - "문자열형 AC의 문구 대조와 seed·scope 항목 수 일치의 기계 강제."
  - "Check 2의 seed 판독 원천(디스크 seed.yaml) 변경."
assumptions:
  - "시작 HEAD는 main d86a5e1(2026.91 범프)이고, 두 게이트는 commit-gates.mjs:56의 GATES 목록으로만 스폰됩니다(index.ts에는 참조가 없음 — grep 확인)."
  - "리포 이력의 current-scope.md 체크박스는 모두 AC id로 시작하고 공백이 뒤따릅니다(git log -- docs/harness/current-scope.md 확인) — 첫 토큰 대조가 기존 scope와 맞습니다."
  - "훅 모드에서 git은 GIT_INDEX_FILE로 커밋이 담을 인덱스를 넘기므로 git show :path가 그 커밋의 scope를 돌려줍니다(.githooks/pre-commit 환경 계약)."
risks:
  - "kickoff Step 6 템플릿은 체크박스에 id를 요구하지 않습니다 — 객체형 seed에 id 없는 scope는 closeout에서 BLOCK되며, 차단 메시지와 CHANGELOG가 thread-scope open 재개 또는 id 접두를 안내합니다(템플릿 정합은 범위 밖)."
  - "게이트의 seed AC 판독은 thread-scope.mjs parseAC의 복제입니다 — 한쪽만 바뀌면 어긋나며, 실제 thread-scope.mjs로 scope를 생성하는 테스트(전체 → allow, --ac 부분 → BLOCK, 따옴표 id)가 이를 잡습니다."
  - "스테이지된 scope 삭제 + 디스크에 체크된 사본을 남기는 의도적 우회는 Check 3를 종전처럼 통과합니다(통합 계약에 경계로 기록)."
  - "게이트 본문 줄 번호가 밀려 계약 문서의 file:line 인용을 함께 옮겼습니다 — 리뷰 수정으로 게이트가 다시 바뀌면 인용을 다시 맞춰야 합니다."
