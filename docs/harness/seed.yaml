# gh-loop worker Stage 2에 따라 이슈 #109 본문(F1~F4, AC 5개, 범위 밖)과 코디네이터 댓글 두 건
# (2026-11-13 병합분 C2·C3·D5, 2026-11-18 추가분 `;` 목록·아카이브 멤버 `?q=`·추가 AC 2개)을 명세로 삼습니다.
# 이슈 본문과 댓글이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(bootstrap-source-only-skills-134)는 git 이력에 보존합니다.
goal: >
  #109: gates/read-path.mjs의 read/write 경로 해석을 omp 18.22.0에 다시 맞춥니다(기준선 18.3.0).
  read의 `?` 쿼리, 꼬리가 섞인 콤마 범위, 대문자 셀렉터, 컨테이너 멤버(아카이브·SQLite·PDF 페이지), `;` 목록이
  read-log에 유령 경로를 남겨 뒤따르는 edit/write가 context-gate에 거짓 차단되던 경로를 없애고,
  write에 복사된 `[path#TAG]` 래퍼가 읽지 않은 기존 파일의 덮어쓰기를 통과시키던 우회를 막습니다.
constraints:
  - "over-strip(읽지 않은 파일을 읽은 것으로 기록)은 under-strip(유령 경로 → 거짓 차단)보다 나쁜 방향입니다. 업스트림과 다르게 둘 수밖에 없는 형태는 덜 벗기는 쪽으로 둡니다."
  - "업스트림 동작은 추측하지 않고 문서(omp://tools/read.md, xd://read/sources, omp://tools/write.md), v18.22.0 소스(`packages/tui/src/tools/read.ts`, `packages/coding-agent/src/tools/{read,hashline-header-path,sqlite-reader,read-archive}.ts`), 실제 도구 실측으로 확인합니다."
  - "`readTarget(input, cwd)`은 목록을 돌려주는 `readTargets(input, details, text, cwd)`로 바뀝니다(2026-11-17 감사 §C3 해결 방향이 예고한 반환형 변경). 이슈 AC의 `readTarget(...) → <cwd>/<file>`은 `readTargets(...) → [<cwd>/<file>]`로 읽습니다."
  - "목록인지 아닌지는 omp가 정합니다 — 입력을 `;`로 직접 쪼개지 않고, omp가 fan-out했을 때 결과에 싣는 `details.displayReadTargets`의 부분들을 쓰며, `Could not read <part>: …`로 보고된 부분은 기록하지 않습니다(r1 리뷰: 입력 분할은 SQL 쿼리 안의 `;`와 실패한 멤버를 읽은 것으로 기록했습니다)."
  - "기준 버전 문구는 2026-11-13 AC 후보가 적은 18.18.6이 아니라 실제로 대조·실측한 18.22.0으로 적습니다(2026-11-18 댓글 §4가 기준 주소·버전 문구의 갱신을 지시)."
  - "버전 범프·태그·자동 머지·force-push는 하지 않습니다."
acceptance_criteria:
  - id: AC1
    title: "F1 — `package.json?q=.scripts`, `docs/harness/audit.jsonl?q=.event&limit=5`, `logo.png?q=…`, `db.sqlite?q=SELECT …`가 쿼리를 벗긴 `<cwd>/<file>`로 풀립니다."
  - id: AC2
    title: "F2 — `editTargets('write', { path: '[src/foo.ts#1A2B]' }, CWD)`가 `[<cwd>/src/foo.ts]`를 돌려주고, context-gate가 읽지 않은 `src/foo.ts`의 덮어쓰기를 차단합니다."
  - id: AC3
    title: "F3·D5 — `attachment`·`cfg`·`security`·`vault`·`out`·`mr`이 `://`와 `:/` 양쪽에서 가상 경로로 판정돼 read 쪽은 빈 목록, `localFileTarget`은 `null`입니다."
  - id: AC4
    title: "F4 — `SEARCH_ANCHOR_HEADER`가 `[path/with#hash.ts#1A2B]`를 매칭하고, `READ_SELECTOR`가 `:RAW`/`:IMG`/`:-60+10`을 벗깁니다."
  - id: AC5
    title: "C2·C3·아카이브 — `a.md:1-30,-30`·`a.md:1-30,:-30`·`doc.pdf:page3.png`·`arc.tar:member.json?q=.x`가 파일 경로만 남깁니다."
  - id: AC6
    title: "`;` 목록 — `a.md;b.md`와 `a.md:1-5;b.md:3-9`를 읽은 뒤 두 파일이 모두 read-log에 기록됩니다(테스트)."
  - id: AC7
    title: "D5 — `read-path.mjs`의 문법 주석과 `harness-harness_integration_contract.md`의 미러 서술이 기준 버전 18.22.0과 기준 주소(`xd://read/sources` 포함)를 가리킵니다."
  - id: AC8
    title: "`node --test .omp/extensions/harness/tests/read-path.test.mjs`와 전체 `tests/*.test.mjs`, `node scripts/docs-drift`가 통과하고(항목별 RED→GREEN 회귀 테스트 포함) `CHANGELOG.md` `[Unreleased]`에 항목이 있습니다."
out_of_scope:
  - "에이전트·문서 정합(#110)과 워크트리 CoW 상태 격리·commitTargetDir(#111)."
  - "`harness-friction`의 `references/harness-surface.md` 갱신(2026-11-17 감사 사이클 ④)."
  - "`edit`의 `MV DEST` 대상을 read-log에 넣는 것(2026-11-18 댓글 §4가 선택 사항으로 둠 — 이번에는 넣지 않습니다)."
  - "`edit.citationTags` 활성화 시의 `HASHLINE_HEADER` 재검(#10)."
  - "`~` 확장·`file://`·`www.` 대상·suffix 해석처럼 이번 감사가 지목하지 않은 기존 경로 형태."
  - "`write`의 컨테이너 대상(`arc.tar:member`, `db.sqlite:table[:key]`)을 컨테이너 파일로 게이트하는 것과 `edit` 직접 경로의 래퍼 언래핑 — r1 리뷰가 지목한 기존 결함으로 이슈 범위 밖입니다(후속 이슈 권고)."
assumptions:
  - "시작 HEAD는 main d86a5e1(2026.91 범프)이고 `read-path.mjs`는 3dc461e 이후 변경이 없습니다."
  - "설치된 omp는 18.22.0이며 실측은 이 버전의 `read`/`write` 도구로 했습니다."
  - "일반 텍스트 `read` 결과에는 `details.resolvedPath`가 없어(`meta.source`만 있음, 세션 기록 400개 실측) 이슈가 비교를 요청한 `resolvedPath` 우선안은 주 경로가 될 수 없습니다 — 한 경로의 정규화는 문자열 미러로 하고, 목록 fan-out만 결과(`details.displayReadTargets`·`details.notes`·본문)에서 읽습니다."
  - "`v18.18.9`의 `parseXdUrl`은 확장 런타임 API라 node로 도는 `.mjs` 모듈·테스트에서 쓸 수 없어 스킴 allowlist를 유지합니다."
risks:
  - "셀렉터·컨테이너 확장자·스킴 목록은 omp 버전에 묶여 있습니다 — 새 형태는 유령 경로(거짓 차단)로 퇴화하므로 omp 업그레이드마다 재대조합니다."
  - "`readTargets`가 리터럴 우선·컨테이너 후보 선택·목록 부분의 존재 확인에 `existsSync`를 씁니다 — 모듈이 더는 순수 함수 층이 아닙니다(통합 계약 문서에 반영)."
  - "목록 판정은 omp 18.22.0의 결과 형태(`displayReadTargets`, `Could not read <part>: ` 문구)에 묶여 있습니다 — 형태가 바뀌면 목록이 한 경로로 취급돼 유령 경로(거짓 차단)로 퇴화하고, 문구만 바뀌면 존재 확인이 바닥 역할을 합니다."
  - "업스트림 splitter와의 알려진 차이 두 가지: `:-N+C` 상위집합(AC 요구 — 로컬 read는 업스트림에서 오류라 추적되지 않음), 문서에 없는 `N:M` 목록 병합 미반영(덜 벗기는 방향)."
  - "이 세션에 로드된 확장은 옛 코드입니다 — 실제 게이트 동작은 핸들러 테스트로 검증하고, 새 세션부터 적용됩니다."
