name: seed-lifecycle-contract-114
status: approved
version: 1
task_id: "20261020-025203-da34"
# gh-loop worker Stage 2에 따라 이슈 #114 본문(패널 감사 C4·C11·C19의 file:line 모순 목록, AC1~AC5, 범위 밖)을 명세로 삼습니다.
# 이슈 본문이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(dev-discipline-docs-115, 그 앞 #113 seed 포함)는 git 이력에 보존합니다.
goal: >
  #114: seed/kickoff 생애주기 계약 문서를 스킬·게이트·스크립트 코드에 맞춥니다 — rubric 5차원과 kickoff 산출물 7종,
  seed 템플릿의 task_id·estimate, active seed와 draft→approved 전이의 단일 정의, 닫힌 seed 재개와 version 규칙의 통일,
  부분 AC 스레드가 seed 전체를 닫지 않는 closeout 조건(C19)과 그 잔존면.
constraints:
  - "docs-only입니다 — 게이트·스크립트·스킬 코드는 바꾸지 않고, 어긋나는 쪽은 문서를 코드(acceptance-gate.mjs·thread-scope.mjs·scripts/docs-drift)에 맞춥니다."
  - "변경 파일은 docs/rules/·docs/templates/·docs/checklists/·.omp/rules/harness-harness_integration_contract.md(잔존면 1단락)와 gh-loop Stage 2 워크플로 산출물(docs/harness/) 안에 둡니다."
  - "kickoff 스킬이 정본이며 계약을 스킬에 맞춥니다."
acceptance_criteria:
  - id: AC1
    title: "docs/templates/seed.template.yaml에 task_id와 선택 estimate가 있고, kickoff 출력 계약·rubric 템플릿·rubric 체크리스트가 5차원(coverage 포함)과 산출물 7종(kickoff-done·kickoff-summary.md·seed.yaml·plan-attack-report.md·rubric-report.md·current-scope.md·audit.jsonl)을 스킬과 같게 정의합니다."
  - id: AC2
    title: "active seed와 draft→approved 전이가 seed_contract.md §생애주기 한 곳에 정의되고 closeout·startdev·artifact_roles 계약이 그 정의를 인용하며, docs-drift closeoutConsistency·acceptance-gate·thread-scope 동작과 어긋나던 서술(orphan 정의 등)이 코드에 맞춰집니다."
  - id: AC3
    title: "닫힌 seed 재개 규칙이 '같은 기능이면 thread-scope open, 새 기능이면 kickoff'로 startdev 계약 preflight까지 통일되고, version 증가 조건이 seed_contract·seed_evolution_policy·artifact_roles에서 하나(seed_contract §생애주기 version 규칙)입니다."
  - id: AC4
    title: "closeout 계약 §2가 seed의 모든 AC 충족 근거를 요구하고, 현 게이트가 그것을 검증하지 못한다는 사실이 harness-harness_integration_contract.md Known residual surfaces에 한 단락으로 적혀 있습니다."
  - id: AC5
    title: "node scripts/docs-drift가 0 errors, 하네스 suite(node --test .omp/extensions/harness/tests/*.test.mjs)가 전 항목 통과하고, 변경 파일이 허용 목록 안에 있습니다."
out_of_scope:
  - "thread-scope.mjs·acceptance-gate.mjs·docs-drift 코드 변경(필요하면 후속 이슈로 제안만 합니다)."
  - "kickoff·startdev 스킬 본문 변경 — 스킬이 정본입니다."
  - "AGENTS.md·claudedocs/CLAUDEKR.md — AGENTS.md를 바꾸지 않으므로 미러 동기화 대상이 아닙니다."
  - "docs/glossary.yaml의 'seed의 4차원 품질 판정' 서술 — AC5 허용 목록 밖이라 후속 제안으로 남깁니다."
assumptions:
  - "시작 HEAD는 main 538fdcc이고 이슈의 file:line은 그 커밋 기준입니다."
  - "draft→approved를 수행하는 스크립트·게이트는 없으며(리포 전체 grep), gh-loop 워커는 이슈 본문을 승인된 명세로 보고 seed를 approved로 착지시켜 왔습니다(#105·#112 seed 이력)."
risks:
  - "startdev 스킬 Phase 0.5는 done/superseded에서 kickoff만 안내해 새 계약 preflight(thread-scope open 경로 포함)와 문구가 다릅니다 — 스킬 변경은 범위 밖이라 후속 제안으로 남깁니다."
  - "closeout §2 (ii)는 게이트가 검사하지 못하는 에이전트 책임이라 잔존면으로만 남습니다."
