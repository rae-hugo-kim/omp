# gh-loop worker Stage 2에 따라 이슈 #91 본문(실패 A·B, 수락 기준 4건)과 "세션에서 직접 결정함" 댓글(AC 4건대로 진행, 머지 순서 #91 → #93 → #94)을 명세로 삼습니다.
# 직전 완료 seed(cross-repo-guard-15)는 git 이력에 보존합니다.
goal: >
  macOS(BSD sed, /var → /private/var 별칭)에서 하네스 테스트 10건이 실패하는 이식성 결함을 닫습니다 —
  A) cross-repo.test.mjs의 fixture가 mkdtempSync 결과를 realpath로 정규화해 기대값을 만듭니다(운영 코드 repo-root.mjs의 실경로 계약은 그대로, 정규화 헬퍼는 #94가 재사용하도록 tests/helpers로 분리).
  B) scripts/harness-version-bump.sh가 `sed -i`(두 -e) 대신 임시 파일 + mv로 harness-meta.json을 갱신해 BSD/GNU 양쪽에서 동작합니다.
constraints:
  - "운영 코드(gates/repo-root.mjs 등)는 건드리지 않습니다 — 실경로 보안 계약을 약화하거나 테스트를 macOS에서 건너뛰지 않습니다."
  - "tests/cross-repo.test.mjs는 #93·#94도 수정하므로 변경은 import 1줄 + mkdtemp 호출 2곳으로 최소화합니다."
  - "version-bump의 CHANGELOG/meta 동시 처리·CRLF·파일 모드·임시 파일 노출 방지(.git 안 임시 파일)·실패 후 복구 계약과 기존 harness-version-bump.test.mjs를 그대로 유지합니다."
  - "macOS 실기는 이 머신에 없습니다: BSD sed -i 파싱을 재현하는 shim 테스트와 별칭 TMPDIR(심볼릭 링크) 재현으로 대신하고, 임시 파일 방식이 sed 방언과 무관함을 근거로 적습니다."
  - "Stage 2의 체크 완료 seed·scope → 코드 커밋(앞에 reviewer 3-pass) → 리뷰 후속 → closeout 커밋 순서를 따릅니다."
acceptance_criteria:
  - id: AC1
    title: "cross-repo.test.mjs의 withFixture/withTree가 realpath 정규화된 임시 루트를 쓰고(헬퍼 tests/helpers/real-tmpdir.mjs), /var 별칭이 있는 TMPDIR에서 기존 4건(repoToplevel·shellWriteTargets·AGENTS.md·CLAUDE.md 차단 메시지)이 통과합니다 — 별칭 TMPDIR 재현에서 수정 전 4건 실패 → 수정 후 0건 실패. 링크드 워크트리·다른 리포 차단·심볼릭 링크 경계 검증은 그대로 통과합니다."
  - id: AC2
    title: "scripts/harness-version-bump.sh가 harness-meta.json을 `sed -i` 없이(임시 파일 → 원본 모드 복사 → sed 출력 → mv) 갱신하고, 기존 harness-version-bump.test.mjs 전부가 그대로 통과합니다(CHANGELOG/meta 동시 커밋·CRLF·파일 모드·임시 파일 미노출·실패 후 복구 포함)."
  - id: AC3
    title: "BSD sed의 `-i SUFFIX` 파싱을 재현하는 shim을 PATH 앞에 둔 회귀 테스트가 추가되어, 수정 전 스크립트에서는 `sed: -e: No such file or directory`로 실패하고 수정 후에는 통과하며, meta 파일 모드와 임시 파일 부재를 함께 확인합니다."
  - id: AC4
    title: "Linux에서 전체 하네스 suite(node --test .omp/extensions/harness/tests/*.test.mjs)와 node scripts/docs-drift가 회귀 없이 통과합니다."
