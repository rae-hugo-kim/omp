# 라벨 조회 항목을 정정한 댓글(2026-11-18 15:49Z — 빈 결과는 일시 지연이었고 이 이슈의 이유와 AC는 그대로)을 명세로 삼습니다.
# 이슈 본문이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(bootstrap-source-only-skills-134)는 git 이력에 보존합니다.
goal: >
  #140: GitHub 리포 이름 변경(omp → rae-hugo-kim/pylon, 2026-11-18)을 하네스에 반영합니다.
  scripts/harness-sync.sh의 원본 자가 판정이 origin의 옛 이름과 새 이름을 모두 원본으로 받게 해
  origin을 새 주소로 옮긴 원본 체크아웃이 자신을 소비 리포로 보고 하네스 파일을 덮어쓰지 않게 하고,
  기본 소스 주소와 살아 있는 스킬·README·테스트 픽스처의 옛 이름을 새 이름으로 고칩니다.
constraints:
  - "이 체크아웃의 origin 주소, 로컬 디렉터리 이름, Orca 워크스페이스 이름은 바꾸지 않습니다."
  - "시점 기록 문서의 옛 이름은 바꾸지 않습니다 — docs/harness/archive/**, docs/harness/audit.jsonl, CHANGELOG 과거 항목, docs/handoff/, claudedocs/의 분석 기록(rule://harness-doc_standards R6)."
  - "버전 범프·태그는 이 PR에서 하지 않습니다. 발행은 승인제라 머지 뒤 코디네이터가 승인을 받아 실행하며(워커 프롬프트 지시), PR 본문에 머지 뒤 범프가 필요하다고 적습니다."
  - "소비 리포의 source_remote(고칠 곳 5)는 sync가 새 주소로 갱신할지 그대로 둘지를 비교해 정하고, 결정과 근거를 harness-check 스킬과 PR 본문에 적습니다."
  - "원본 판정은 전처럼 호스트·경로 경계에 앵커합니다 — 접두만 같은 주소(notrae-hugo-kim/pylon 등)는 원본이 아닙니다."
acceptance_criteria:
  - id: AC1
    title: "origin이 git@github.com:rae-hugo-kim/omp.git이든 …/pylon.git이든 bash scripts/harness-sync.sh가 원본으로 판정하고 끝납니다. 접두만 같은 주소는 원본으로 판정하지 않습니다(테스트)."
  - id: AC2
    title: "살아 있는 문서와 스킬(고칠 곳 2·3)에 옛 이름이 남지 않습니다 — git grep -n 'rae-hugo-kim/omp' -- README.md README.en.md .omp/skills scripts의 결과가 AC1의 '옛 이름도 받는다'를 구현한 줄뿐입니다."
  - id: AC3
    title: "init의 gh repo create --template rae-hugo-kim/pylon과 SOURCE_REMOTE가 새 이름입니다."
  - id: AC4
    title: "node --test .omp/extensions/harness/tests/*.test.mjs와 node scripts/docs-drift가 통과하고, 소비 리포가 받을 동작 변경이므로 버전을 한 번 올립니다 — 범프는 머지 뒤 코디네이터가 승인을 받아 실행하고, 이 PR은 CHANGELOG [Unreleased] 항목과 PR 본문의 '머지 뒤 범프 필요'로 준비합니다."
  - id: AC5
    title: "PR 본문에 머지 뒤 각 머신에서 할 일을 적습니다 — git remote set-url origin git@github.com:rae-hugo-kim/pylon.git 한 줄과, 그 전에는 새 이름으로 새로 clone한 체크아웃에서 harness-check를 돌리지 말라는 주의."
out_of_scope:
  - "시점 기록 문서의 옛 이름 수정(constraints 참조)."
  - "로컬 디렉터리 이름(…/workspace/omp)과 Orca 워크스페이스 이름 변경."
  - "gh issue list 라벨 조회 지연에 대한 gh-loop Stage 1 상한 백스톱 개선(정정 댓글이 이 이슈의 범위 밖으로 둔 관찰)."
  - "버전 범프·태그·릴리스 실행, 각 머신의 origin 주소 변경 실행."
assumptions:
  - "시작 HEAD는 main d86a5e1(2026.91 범프)이고 이 체크아웃의 origin은 옛 주소(리다이렉트로 동작)입니다."
  - "기존 소비 리포의 source_remote는 init·migrate가 쓴 GitHub 주소(git@github.com:<옛 이름>.git 리터럴, 또는 그 https/ssh:// 표기)입니다."
  - "gh repo create --template <새 이름>의 동작은 리포를 실제로 만들어야 확인할 수 있어 확인하지 않습니다(이슈 '주의'와 같은 한계)."
risks:
  - "옛 이름 판정은 전환이 끝날 때까지 남습니다. 그 이름으로 새 리포가 만들어지면 GitHub 리다이렉트가 끊기고 그 리포가 원본으로 판정됩니다(SOURCE_REPO_OLD 주석과 harness-check 스킬에 적습니다)."
  - "source_remote 갱신은 GitHub 표기 세 가지만 다룹니다. SSH 호스트 별칭·미러 주소는 그대로 남아 수동 수정이 필요합니다(잘못 바꾸는 쪽보다 안 바꾸는 쪽으로 실패하게 한 선택)."
  - "이 변경이 든 스크립트를 받기 전에 origin을 새 주소로 바꾸거나, 새 주소로 새로 clone한 옛 리비전에서 harness-check를 돌리면 하네스 파일이 덮어써집니다(PR 본문과 스킬의 주의로만 막습니다)."
