name: autonomy-github-runtime
status: draft
version: 1
task_id: "20260618-212940-642a"
goal: >
  option-A 런타임 저작 — 검증된 gh-loop을 **자율 실행**하는 재사용 하네스 자산: (1) `templates/` 아래
  GitHub Actions 워크플로 템플릿(issue_comment=resume / issues=start 트리거 → runner 결정 헬퍼 →
  에이전트 CLI 헤드리스 호출), (2) **테스트가능 runner-decision 헬퍼**(이벤트+권한+라벨 → start/resume/
  ignore; gh 호출 seam; guard policy의 실행체), (3) runner+secrets 셋업 가이드, (4) 전파 배선. 저작·배포는
  이 레포; 실제 자율 실행(runner·secrets)은 각 프로젝트 몫(Q2.1 축 분리). self-hosted runner 미설치라
  **라이브 구동은 out_of_scope** — 로직(헬퍼) 단위테스트 + 워크플로 구조 검증까지. (자율화 Q2 → 옵션 A)

context:
  source: claudedocs/harness-auto-capture-analysis.md#Q2.7-3,Q2.9   # 옵션 A 승급 + 배포 메커니즘
  date_locked: 2026-06-18
  related_docs:
    - claudedocs/harness-auto-capture-analysis.md          # Q2.7 staging, Q2.9 전파 경로(L167-178)
    - .omp/skills/gh-loop/SKILL.md                          # 루프 절차 + 확정 guard policy (실행체로 옮김)
    - .omp/extensions/harness/gh-loop-issue.mjs             # 테스트가능 헬퍼 + gh-seam 선례
    - scripts/harness-sync.sh                               # templates/ 전파(통째), .github/ 미전파
    - scripts/harness-version-bump.sh                       # templates/ 변경 = bump 대상

constraints:
  - 저작·배포만 — 실제 자율 실행(self-hosted runner + secrets)은 각 프로젝트 인프라 (Q2.1)
  - 워크플로는 `templates/` 아래 — harness-sync가 통째 전파, `.github/`는 미전파; init/migrate가 **instantiate-once** (force-sync 금지) (Q2.9)
  - runner 결정 로직은 **테스트가능 헬퍼**로 추출(gh 호출 seam) — gh-loop-issue.mjs 선례; 워크플로 YAML은 얇은 글루
  - guard policy 실행체 — **write+ 권한 / bot 토큰·`gh-loop:` 마커 자기제외 / owner 우선·이견 parked / 모호 parked** (gh-loop seed에서 확정)
  - **머지 자동 금지** 불변식 유지 — 워크플로/헬퍼가 `gh pr merge` 자동 실행 안 함
  - 위험 변경(런타임 로직)은 **연속 이종(codex 포함) 리뷰** 후 커밋 (het-gate 정책)

in_scope:
  - `templates/<gh-loop-workflow>.yml` — issue_comment(resume)+issues(start) 트리거, guard-gated, 에이전트 CLI 헤드리스 호출
  - `.omp/extensions/harness/gh-loop-runner.mjs` — 이벤트→action(start/resume/ignore) 결정 + 권한/봇/라벨/모호 가드, gh seam, 단위테스트
  - runner+secrets 셋업 가이드 (per-project 인프라·결정 명시) — `templates/` README 또는 gh-loop SKILL의 option-A 섹션
  - 전파 확인: 템플릿 `templates/` 통째 sync, 헬퍼 `.omp/extensions/harness/` 통째 sync; instantiate-once 경로 문서화
  - AGENTS.md/README 반영(해당 시)

out_of_scope:
  - 라이브 runner 실행 / E2E 자율 구동 — self-hosted runner 미설치(각 프로젝트 인프라; Q3.9)
  - secrets 프로비저닝(GH 토큰 스코프·모델 API 키) — 각 프로젝트
  - Codex CI 이식 — 컴패니언 로컬 플러그인(Q2.5 deferred)
  - finding 자동 탐지(리뷰/린트→이슈) (Q2.7-4)
  - GitHub-hosted runner — 자율 에이전트+repo write는 self-hosted 권장(선택은 프로젝트)
  - init/migrate의 instantiate 로직 구현 변경 — 템플릿이 `templates/`에 존재하는 것까지(인스턴스화 훅 신설은 별도)

assumptions:
  - templates/는 harness-sync PATHS·version-bump HARNESS_PATHS에 이미 포함(L35-49) — 신규 PATHS 등록 불필요
  - 실행 에이전트는 OMP/Claude 계열 CLI 헤드리스(스킬이 `issue://` 등 OMP 리소스 사용) — CLI·auth는 per-project
  - 권한 확인은 `gh api repos/{repo}/collaborators/{user}/permission`(seam) — 헬퍼는 주입된 권한으로 판정

acceptance_criteria:
  - id: AC1-runner-helper
    title: 이벤트→action 결정 헬퍼 + 단위테스트
    source: "analysis Q2.7-3 (L155); gh-loop-issue.mjs 선례"
    must:
      - "`.omp/extensions/harness/gh-loop-runner.mjs` — 입력(event kind, labels, actor, actor permission, bot-identity/marker) → {action: start|resume|ignore, reason}"
      - gh/agent 호출은 seam(주입) — 라이브 GitHub 없이 결정 로직 단위테스트
    verify:
      - start(라벨된 새 이슈)·resume(needs-decision 댓글)·ignore(무관/봇자기/권한미달) 단위테스트 통과
  - id: AC2-workflow-template
    title: templates/ 워크플로 템플릿
    source: "analysis Q2.7-3·Q2.9 (L155, L175)"
    must:
      - "`templates/` 아래 워크플로(issue_comment+issues 트리거) — runner 헬퍼 호출 후 에이전트 CLI 헤드리스 실행"
      - "`.github/`가 아닌 `templates/`에 둠(전파 가능); 인스턴스화는 init/migrate 1회"
    verify:
      - YAML 파싱 유효; (actionlint 설치 시) lint 통과; 트리거·가드 단계 존재
  - id: AC3-guard-executable
    title: guard policy 실행체화
    source: ".omp/skills/gh-loop/SKILL.md Guard policy (확정)"
    must:
      - write+ 권한 미달 actor 무시 / 봇 자기 댓글 제외(토큰 or `gh-loop:` 마커) / 모호하면 ignore(parked)
      - 헬퍼가 prose 컨벤션을 실행 코드로 강제
    verify:
      - 권한미달→ignore, 봇자기→ignore, 비결정 댓글→ignore 단위테스트
  - id: AC4-setup-guide
    title: runner+secrets 셋업 가이드
    source: "analysis Q2.1·Q2.7-3 (per-project 인프라)"
    must:
      - self-hosted runner 프로비저닝 + 필요한 secrets(GH 토큰 스코프, 모델 키) + 에이전트 CLI 설치 명시
      - per-project **결정**(트리거 범위·권한 임계값·CLI) 명시
    verify:
      - 가이드 문서 존재 + per-project 인프라/결정/시크릿 항목 포함
  - id: AC5-propagation
    title: 전파 + instantiate-once 경로
    source: "analysis Q2.9 (L175); harness-sync PATHS"
    must:
      - 템플릿이 `templates/`(sync 통째), 헬퍼가 `.omp/extensions/harness/`(sync 통째)에 위치
      - instantiate-once 경로(init/migrate가 templates/→.github/ 1회) 문서화
    verify:
      - 파일 위치가 synced PATHS에 포함 확인; `node scripts/docs-drift` 0/0
  - id: AC6-no-auto-merge
    title: 머지 자동 금지 유지
    source: ".omp/skills/gh-loop/SKILL.md Non-Negotiables"
    must:
      - 워크플로/헬퍼 어디서도 `gh pr merge` 자동 실행 안 함; 머지는 인간 승인 경로만
    verify:
      - 헬퍼 action에 'merge' 자동 없음(테스트); 템플릿에 `gh pr merge` 무조건 실행 없음(grep)

decisions:
  substrate:
    value: "GitHub Actions + self-hosted runner (option A)"
    reason: "Q2.7-3. GitHub-hosted는 자율 에이전트+repo write 보안상 비권장."
    status: confirmed
  template_home:
    value: "`templates/` (init/migrate instantiate-once)"
    reason: "Q2.9 — `.github/`는 harness-sync 미전파, `templates/`는 통째 전파."
    status: confirmed
  runtime_logic:
    value: "테스트가능 헬퍼(gh-loop-runner.mjs)로 추출, YAML은 글루"
    reason: "라이브 검증 불가(runner 미설치)라도 로직은 단위테스트로 검증; gh-loop-issue.mjs 선례."
    status: confirmed
  agent_cli:
    value: "per-project (OMP/Claude 헤드리스 기본, 가이드에 명시)"
    reason: "스킬이 OMP 리소스(`issue://`) 사용 — 실행 에이전트는 OMP 계열; CLI/auth는 프로젝트 인프라."
    status: confirmed
  live_exec:
    value: "out_of_scope (runner 미설치)"
    reason: "Q3.9 self-hosted runner 미설치 — 라이브 자율 구동은 각 프로젝트가 runner 갖춘 뒤."
    status: confirmed

risks:
  - id: R1
    desc: 워크플로 YAML이 라이브 미검증 — 실제 Actions에서만 드러나는 버그
    mitigation: 결정 로직을 헬퍼로 빼 단위테스트; YAML은 파싱/actionlint + 구조 리뷰; 라이브는 out_of_scope 명시(stub 미배포 — 검증가능 부분만 납품)
  - id: R2
    desc: 자율 실행이 repo write로 사고(잘못된 머지/푸시)
    mitigation: 머지 자동 금지 불변식(AC6) + write+ 권한 가드 + self-hosted 권장
  - id: R3
    desc: instantiate-once가 force-sync로 사용자 워크플로 덮어씀
    mitigation: 템플릿은 `templates/`에만(force-sync 대상), 인스턴스(.github/)는 1회 복사 후 사용자 소유 — 문서에 명시

references:
  - path: claudedocs/harness-auto-capture-analysis.md
    reason: Q2.7-3(옵션 A 승급) + Q2.9(전파 경로) = 본 seed 원본
  - path: .omp/skills/gh-loop/SKILL.md
    reason: 루프 절차 + 확정 guard policy(헬퍼로 실행체화)
  - path: .omp/extensions/harness/gh-loop-issue.mjs
    reason: 테스트가능 헬퍼 + gh-seam 패턴 선례
  - path: scripts/harness-sync.sh
    reason: templates/ 통째 전파 / .github/ 미전파 — template_home 결정 근거
