# gh-loop worker Stage 2에 따라 이슈 #134 본문("만들 것" 1~3, AC 4개, "확인 문장", "범위 밖")을 명세로 삼습니다.
# 이슈 본문이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(harness-friction-audit-129)는 git 이력에 보존합니다.
goal: >
  #134: risk-assess의 템플릿 부트스트랩 창이 /init Phase 2가 지우는 소스 전용 스킬 디렉터리 두 개
  (.omp/skills/harness-skill-tune/, .omp/skills/harness-friction/)의 삭제를 소스 전용 자산 삭제로 다루게 해,
  /init 첫 커밋이 review-gate에 막히지 않게 합니다. init/SKILL.md의 두 항목을 "건너뛰기"에서 "삭제"로 바꾸고
  예외 서술을 코드와 맞춥니다.
constraints:
  - "다른 .omp/skills/ 경로(동기화되는 하네스 스킬)는 지금처럼 하네스 자산 경로로 남습니다 — 창 안에서도 삭제가 채점됩니다."
  - "예외를 경로 나열로 할지 PATHS 기반으로 일반화할지는 비교해 정하고 근거를 PR 본문에 적습니다. 예외를 넓히는 선택이 테스트로 닫히지 않으면 결정 요청으로 올립니다."
  - "부트스트랩 창의 다른 조건(단일 커밋·refs/harness 부재·meta 전이·편집 목록)은 바꾸지 않습니다."
acceptance_criteria:
  - id: AC1
    title: "부트스트랩 창 안의 커밋이 두 디렉터리를 삭제해도 risk가 high로 오르지 않습니다(테스트)."
  - id: AC2
    title: "동기화되는 하네스 스킬 디렉터리의 삭제와, 부트스트랩 창 밖에서의 두 디렉터리 삭제는 예외를 받지 않습니다(테스트)."
  - id: AC3
    title: "init/SKILL.md의 두 항목이 삭제로 적혀 있고, 예외 서술이 코드와 일치합니다."
  - id: AC4
    title: "node --test .omp/extensions/harness/tests/*.test.mjs와 node scripts/docs-drift가 통과하고, CHANGELOG.md의 [Unreleased]에 항목이 있습니다."
out_of_scope:
  - "두 스킬을 소비 리포로 동기화하는 것(harness-sync.sh 화이트리스트)."
  - "부트스트랩 창의 다른 조건 변경."
  - "이미 만들어진 소비 리포에 남은 디렉터리 정리(수동 삭제 안내까지만)."
assumptions:
  - "시작 HEAD는 main a7b80c3(#133 머지)이고 두 스킬 디렉터리와 init의 건너뛰기 항목 두 개가 main에 있습니다."
  - "risk-assess는 워크트리의 harness-sync.sh를 읽지 않는 정적 목록 원칙(HARNESS_ASSET_PATHS 주석)을 유지합니다."
risks:
  - "새 소스 전용 스킬이 생기면 BOOTSTRAP_SOURCE_ONLY_SKILLS와 init/SKILL.md 두 곳을 함께 고쳐야 합니다 — 누락은 fail-closed(init 첫 커밋이 다시 채점)이고 wiring 테스트 W3d가 두 곳의 일치를 검사합니다."
  - "동기화 스킬의 SKILL.md만 지우는 삭제는 예외 밖이지만 기존 채점대로 docs-only low입니다(이 이슈의 범위 밖 — 예외 여부만 고정)."
