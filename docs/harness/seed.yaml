# gh-loop worker Stage 2에 따라 이슈 #139 본문("배경", "결정(사용자, 2026-11-18)", "범위" 1~4, AC 4개, "확인 문장", "범위 밖")을 명세로 삼습니다.
# 이슈 본문이 사용자 승인 명세이므로 처음부터 approved로 씁니다. 직전 완료 seed(repo-rename-pylon-140)는 git 이력에 보존합니다.
goal: >
  #139: omp 18.20.1+의 선택 커밋(/commit, eval commit 네임스페이스, commit.enabled)이 켜진 리포를
  세션 경고로 알립니다. harness-version-check.mjs가 세션 루트에서 omp config get commit.enabled를 읽어
  true면 HARNESS STALE과 같은 경로·주기(세션 시작·턴 시작 리마인더)로 수정 방법(.omp/config.yml에
  commit: / enabled: false)을 에이전트에게 전달하고, init·migrate가 소비 리포의 .omp/config.yml에
  그 키를 넣으며, 통합 계약 :61이 "eval commit 경로는 설정으로 끈다"는 결정과 잔존면을 적습니다.
constraints:
  - "eval commit 경로로 전환하지 않습니다 — 하네스의 커밋 경로는 bash git commit(compr/compush) 하나입니다(사용자 결정 2026-11-18)."
  - "경고하지 않는 경우: 값이 false, Unknown setting(18.20.1 미만), omp가 PATH에 없음, 타임아웃. 판정은 하드 킬 타임아웃으로 묶습니다."
  - ".omp/config.yml을 scripts/harness-sync.sh 화이트리스트에 넣지 않습니다(원본이 덮어써 소비 리포의 자체 설정을 지움). 전역 설정도 쓰지 않습니다."
  - "init·migrate는 파일이 이미 있으면 키만 추가합니다(다른 설정은 그대로)."
  - "버전 범프·태그·force-push·머지를 하지 않습니다."
acceptance_criteria:
  - id: AC1
    title: "commit.enabled가 켜진 리포에서 세션을 열면 수정 방법이 든 경고가 에이전트 컨텍스트에 실립니다. 꺼져 있거나 키가 없는 omp에서는 나오지 않습니다."
  - id: AC2
    title: "init·migrate 절차를 따른 리포의 .omp/config.yml에 commit.enabled: false가 있습니다."
  - id: AC3
    title: "통합 계약 :61이 결정과 일치하고 node scripts/docs-drift가 0 error로 통과합니다."
  - id: AC4
    title: "새 테스트가 통과하고 기존 harness-version-check 테스트가 깨지지 않습니다."
out_of_scope:
  - "eval commit으로의 전환(재검토 조건은 이슈 본문)."
  - "eval 도구 호출에서 no_verify를 감시하는 방안(통합 계약 :61이 거부한 방향)."
  - "감사의 다른 분할안: read의 ; 목록(#109), wait·Antigravity 서술(#110), 감사 도구 기준 갱신."
assumptions:
  - "시작 HEAD는 main a2f6c62(#140 머지)이고 이 리포의 .omp/config.yml은 이미 commit.enabled: false입니다(9c1229c)."
  - "omp config get은 프로세스 cwd의 .omp/config.yml만 읽고 상위 디렉터리를 올라가지 않습니다(omp settings.md; 이 호스트 18.22.0 실측 — 하위 디렉터리에서는 true)."
  - "omp config get commit.enabled는 18.22.0에서 값을 stdout에 쓰고 exit 0, 모르는 키는 stderr에 Unknown setting을 쓰고 exit 1입니다(실측)."
risks:
  - "프로브는 매 호출 omp 프로세스를 하나 띄웁니다(0.13초 실측). 느린 호스트에서는 3초 하드 킬로 묶여 게이트 예산(15초) 안에 머뭅니다."
  - "--config 오버레이로 켠 세션은 별도 프로세스인 omp config get이 보지 못합니다(통합 계약 :61 잔존면)."
  - "경고는 advisory라 켜진 채로 eval commit을 쓰는 에이전트를 막지 못합니다(:61 잔존면 — 결정대로 방어하지 않습니다)."
  - "harness-version-check.test.mjs는 호스트 omp를 읽지 않도록 실패하는 omp 스텁을 PATH 앞에 둡니다 — 스텁 없이는 commit.enabled가 켜진 호스트에서 기존 케이스가 전부 깨집니다."
