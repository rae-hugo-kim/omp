constraints:
  - 게이트 fail-closed 원칙 유지 — 무감사 우회 경로(bare review-skip 등) 금지
  - 기계 증거는 마크다운을 파싱하지 않음 — strict 위치 기반 JSON tuple 단일 경로(수제 마크다운/키-값 파서 재도입 금지)
  - 증거는 실측만 — models 배열은 adversary 트랜스크립트 실측 확인 시에만 기재
  - 검증 불가 커밋 형태(pathspec, --amend 등)는 fail-closed, plain git commit이 표준 경로
  - 타 세션 워킹트리 변경분 무접촉

