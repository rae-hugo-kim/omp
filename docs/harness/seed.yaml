constraints:
  - "docs-only: 게이트·스크립트 코드는 바꾸지 않고 문서를 코드에 맞춥니다. 변경 파일은 이슈 AC5의 목록 안에 둡니다(docs/harness/ seed·scope·audit는 워크플로 산출물로 범위 안)."
  - "TDD 등급은 사용자 결정 C(2026-10-21)대로 — tdd_policy·change_control·bugfix 체크리스트·verification 규칙이 같은 등급과 같은 예외 목록(인프라 없음·docs/policy-only·자동화 불가 = 무승인, 인프라 있는 코드 로직에서 생략 = 승인)을 서술합니다."
  - "verdict 어휘는 review-gate.mjs:128 VERDICTS(PASS / PASS WITH NOTES / FAIL)를 따르고, severity는 정책이 두 번 명시한 복잡도 초과 = HIGH, 정책 표·MEDIUM 목록·체크리스트가 일치하는 테스트 누락 = MEDIUM으로 맞춥니다."
  - "AGENTS.md를 바꾸지 않으므로 claudedocs/CLAUDEKR.md 동기화·재스탬프는 발생하지 않습니다. claudedocs/CLAUDE_original.md는 동결 스냅샷(status: stale, doc_standards R6)이라 건드리지 않습니다."
